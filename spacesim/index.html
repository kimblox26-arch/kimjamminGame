<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SpaceSim</title>
<link rel="stylesheet" href="./style.css">
<script type="importmap">
{ "imports": { "three": "../vendor/three/three.module.min.js", "three/addons/": "../vendor/three/addons/" } }
</script>
</head>
<body>
<canvas id="gl"></canvas>
<div id="bar" class="panel">
  <b>Space<span>Sim</span></b>
  <select id="scene"></select>
  <button id="slow" title="느리게">⏪</button><button id="pause" title="일시정지 (Space)">⏸</button><button id="fast" title="빠르게">⏩</button>
  <span id="speed">1×</span>
  <label><input id="trails" type="checkbox" checked> 궤적</label>
  <button id="reset" title="처음부터">↺</button>
</div>
<div id="tools" class="panel">
  <select id="kind"><option value="planet">행성</option><option value="star">별</option></select>
  <label>질량 <input id="mass" type="range" min="-2" max="2" step="0.1" value="0"> <span id="massv">1.0</span></label>
  <button id="add">＋ 천체 추가</button>
  <small>추가 모드: 클릭 = 원궤도 · 드래그 = 던지기</small>
</div>
<div id="info" class="panel hidden">
  <b id="info-name"></b><div id="info-body"></div>
  <button id="follow">따라가기</button><button id="del">삭제</button>
</div>
<div id="count" class="panel"></div>
<div id="toasts"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
