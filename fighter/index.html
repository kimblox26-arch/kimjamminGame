<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05080d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>SKYBREAKER — 전투기 자유 비행</title>
<meta name="description" content="직접 설계한 전투기로 하늘을 가르는 초고화질 웹 전투기 자유 비행 게임">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
<script>
  // 이 게임 전용 설정 저장소 + 기본값 (공용 엔진 설정 모듈이 읽음)
  window.SETTINGS_KEY = 'skybreaker.settings.v1';
  (function () {
    var touch = (navigator.maxTouchPoints || 0) > 0 || 'ontouchstart' in window;
    var d = { timeOfDay: 16.4, dayNightRunning: false, weather: 'cloudy', fov: 72, impactFx: 1, hudColor: 'green',
      mouseFlight: true, autoLevel: 'auto', flightMusic: true, sensitivity: 1, musicVolume: 0.55 };
    if (touch) { d.quality = 'medium'; d.renderScale = 0.75; d.shadows = false; d.antialias = false; d.cloudDensity = 0.6; d.mouseFlight = false; }
    window.SETTINGS_DEFAULTS = d;
  })();
</script>
<script type="importmap">
{ "imports": { "three": "../vendor/three/three.module.min.js", "three/addons/": "../vendor/three/addons/" } }
</script>
</head>
<body data-screen="s-loading">
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>

<!-- 로딩 -->
<section id="s-loading" class="screen active">
  <div class="load">
    <div class="logo"><span>SKY</span>BREAKER</div>
    <div class="logo-sub">ULTRA FIGHTER · FREE FLIGHT</div>
    <div id="load-bar" class="bar"><i></i></div>
    <div id="load-label" class="load-label">엔진 초기화</div>
    <div id="load-tip" class="load-tip"></div>
  </div>
</section>

<!-- 메인 메뉴 -->
<section id="s-menu" class="screen">
  <div class="menu-shade"></div>
  <div class="menu">
    <div class="menu-left">
      <div class="logo big"><span>SKY</span>BREAKER</div>
      <div class="logo-sub">ULTRA FIGHTER · FREE FLIGHT</div>
      <nav class="mnav">
        <button class="mbtn primary" data-act="free"><i>01</i><b>자유 비행</b><span>훈련 드론이 떠 있는 넓은 하늘을 마음껏</span></button>
        <button class="mbtn danger" data-act="dogfight"><i>02</i><b>공중전</b><span>몰려오는 적 편대와 SAM 기지를 돌파하라</span></button>
        <button class="mbtn" data-act="hangar"><i>03</i><b>격납고 · 기체 제작</b><span>동체 · 날개 · 엔진 · 도장 · 무장을 직접 설계</span></button>
        <button class="mbtn" data-act="settings"><i>04</i><b>설정</b><span>그래픽 · 조작 · 사운드 · 날씨</span></button>
        <button class="mbtn" data-act="controls"><i>05</i><b>조작법</b><span>키보드 · 마우스 · 게임패드 · 모바일</span></button>
      </nav>
      <div class="menu-foot"><button class="chip" data-act="fullscreen">⛶ 전체 화면</button><span>WebGL2 · 실시간 합성 사운드 · 20km 절차적 월드</span></div>
    </div>
    <aside id="menu-jet" class="jetcard"></aside>
  </div>
</section>

<!-- 격납고 -->
<section id="s-hangar" class="screen">
  <header class="hg-top">
    <button class="btn ghost" id="hg-back">← 메뉴</button>
    <div class="hg-title"><small>HANGAR</small><input id="hg-name" maxlength="16" spellcheck="false"></div>
    <div class="hg-actions">
      <button class="btn ghost" id="hg-random">🎲 랜덤</button>
      <button class="btn ghost" id="hg-save">💾 저장</button>
      <button class="btn primary" id="hg-fly">출격 ▶</button>
    </div>
  </header>
  <div class="hg-panel hg-left">
    <div id="hg-tabs" class="tabs">
      <button data-tab="body">동체</button><button data-tab="wing">날개</button><button data-tab="engine">엔진·꼬리</button><button data-tab="paint">도장</button><button data-tab="arms">무장</button>
    </div>
    <div id="hg-body" class="hg-body"></div>
  </div>
  <div class="hg-panel hg-right">
    <h4>성능</h4>
    <div id="hg-stats"></div>
    <div id="hg-list"></div>
  </div>
  <div class="hg-hint">드래그: 회전 · 휠/핀치: 확대</div>
</section>

<!-- 설정 -->
<section id="s-settings" class="screen panel-screen">
  <header class="ps-head"><h2>설정</h2><button class="btn ghost" data-act="back">← 돌아가기</button></header>
  <div id="settings-body" class="ps-body"></div>
</section>

<!-- 조작법 -->
<section id="s-controls" class="screen panel-screen">
  <header class="ps-head"><h2>조작법</h2><button class="btn ghost" data-act="back">← 돌아가기</button></header>
  <div id="controls-body" class="ps-body"></div>
</section>

<!-- 비행 UI -->
<div id="flight-ui" hidden>
  <button id="btn-pause" class="tbtn small" onclick="window.__SKYBREAKER__ && window.__SKYBREAKER__.setPaused(true)">❚❚</button>
  <div id="touch" hidden>
    <div id="stick-zone"><div id="stick"><div id="stick-knob"></div></div><span class="sz-hint">드래그하여 조종</span></div>
    <div class="t-right">
      <div class="t-btns">
        <button class="tbtn fire" data-t="fire">FIRE</button>
        <button class="tbtn" data-t="missile">MSL</button>
        <button class="tbtn" data-t="flare">FLR</button>
        <button class="tbtn ab" data-t="ab">A/B</button>
        <button class="tbtn small" data-t="camera">CAM</button>
        <button class="tbtn small" data-t="yawL">◀</button>
        <button class="tbtn small" data-t="yawR">▶</button>
      </div>
      <div id="thr-track"><div id="thr-fill"></div><div id="thr-knob">THR</div></div>
    </div>
  </div>
</div>

<div id="banner"></div>
<div id="popups"></div>
<div id="killfeed"></div>

<div id="pause" class="modal" hidden>
  <div class="mcard">
    <h3>일시정지</h3>
    <button class="btn primary" data-act="resume">계속 비행</button>
    <button class="btn ghost" data-act="respawn">재출격</button>
    <button class="btn ghost" data-act="pause-settings">설정</button>
    <button class="btn ghost" data-act="menu">메인 메뉴</button>
    <p class="hint">ESC 키로 계속</p>
  </div>
</div>

<div id="dead" class="modal" hidden>
  <div class="mcard dead">
    <h3>기체 손실</h3>
    <p id="dead-reason"></p>
    <div id="dead-stats" class="dstats"></div>
    <button class="btn primary" data-act="respawn">재출격 (R)</button>
    <button class="btn ghost" data-act="menu">메인 메뉴</button>
  </div>
</div>

<div id="rotate">📱↻ 가로 모드로 돌리면 더 넓게 플레이할 수 있습니다</div>

<noscript><p style="color:#fff;padding:2rem">이 게임은 JavaScript 와 WebGL2 가 필요합니다.</p></noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
