plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kimjammin.kidstock'
    compileSdk 34

    defaultConfig {
        applicationId 'com.kimjammin.kidstock'
        minSdk 26
        targetSdk 34
        // GitHub에서 만들 때마다 번호가 올라가서 새 버전을 덮어 설치할 수 있어요.
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName "1.0.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }

    // 취미용 서명 키예요. 같은 키로 서명해야 새 버전을 덮어 설치할 수 있어요.
    signingConfigs {
        release {
            storeFile file('kidstock.keystore')
            storePassword 'kidstock'
            keyAlias 'kidstock'
            keyPassword 'kidstock'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
