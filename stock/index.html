<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="초등학생을 위한 주식 시뮬레이션 교육 게임">
<title>어린이 주식 놀이터</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23000'/%3E%3Cpath d='M7 22l6-6 4 4 8-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <aside class="side" aria-label="메뉴">
    <a class="brand" href="#home" aria-label="어린이 주식 놀이터 주식창">
      <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#F2F2F3"/><rect x="8" y="22" width="5" height="10" rx="1.5" fill="#000" opacity=".45"/><rect x="17.5" y="16" width="5" height="16" rx="1.5" fill="#000" opacity=".7"/><rect x="27" y="9" width="5" height="23" rx="1.5" fill="#000"/></svg>
      <span><b>어린이 주식 놀이터</b><small>가상 코인으로 배우는 투자</small></span>
    </a>
    <nav id="rail" class="rail"></nav>
    <div class="side-cash"><span class="label">주문 가능 현금</span><b data-live="cash"></b><span class="label">총자산</span><b data-live="total"></b></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button id="backBtn" class="icon-btn" type="button" aria-label="뒤로 가기" hidden><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h1 id="title">주식창</h1>
      <div class="top-right">
        <div class="clock" title="게임 속 시간"><span id="dayIcon"></span><span data-live="clock"></span></div>
        <button id="pauseBtn" class="pause-btn" type="button" aria-label="시간 멈추기"></button>
      </div>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<div id="rotate" class="rotate" role="dialog" aria-label="화면을 가로로 돌려 주세요"></div>
<div id="toasts" aria-live="polite"></div>
<div id="modals"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
