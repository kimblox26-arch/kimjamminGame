<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7b3fa0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>영어숙제 노트</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--bg:#f6f3f8;--card:#fff;--ink:#231a2b;--sub:#6f6577;--line:#e6dfeb;--pri:#7b3fa0;--on:#fff;--pri2:#efe3f6;--ok:#1f9d55;--okbg:#e3f6ea;--bad:#d64545;--badbg:#fbe7e7}
@media (prefers-color-scheme:dark){:root{--bg:#141016;--card:#1f1923;--ink:#f1eaf5;--sub:#a99fb0;--line:#332a39;--pri:#c08ae0;--on:#1a1020;--pri2:#2e2236;--ok:#4ccf86;--okbg:#173322;--bad:#ff7a7a;--badbg:#3a1d1d}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 16px 6px;max-width:560px;margin:0 auto;display:flex;align-items:baseline;gap:8px}
header h1{font-size:20px;margin:0;flex:1}
main{max-width:560px;margin:0 auto;padding:0 16px 96px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--sub);padding:8px 0 10px;font:inherit;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button span{font-size:20px}
nav button.on{color:var(--pri);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.gap{justify-content:center;flex-wrap:wrap;margin-top:12px}
.sub{color:var(--sub);font-size:14px}
.small{font-size:12px;text-align:center;margin:16px 0}
.bar{height:8px;background:var(--pri2);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--pri);transition:width .3s}
input,select,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
textarea{width:100%;resize:vertical;margin:8px 0 0}
.add{display:flex;gap:8px;flex-wrap:wrap}
.add input{flex:1 1 120px}
.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:10px 16px;background:var(--pri);color:var(--on);cursor:pointer;display:inline-block;text-align:center}
.btn.ghost{background:var(--pri2);color:var(--pri)}
.btn.wide{width:100%;margin-top:10px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.item.flat{border:0;padding:6px 0;margin:0;background:none}
.item.done .grow{text-decoration:line-through;color:var(--sub)}
.item input[type=checkbox]{width:20px;height:20px;accent-color:var(--pri);flex:none}
.grow{flex:1;min-width:0;overflow-wrap:anywhere}
.due{font-style:normal;font-size:12px;color:var(--sub);white-space:nowrap}
.due.late{color:var(--bad);font-weight:700}
.x,.ico{border:0;background:none;color:var(--sub);font-size:16px;padding:4px;cursor:pointer}
.badge{font-style:normal;font-size:12px;color:var(--bad);background:var(--badbg);border-radius:99px;padding:2px 8px}
.empty{text-align:center;color:var(--sub);padding:24px 0}
.fld{display:flex;justify-content:space-between;align-items:center;margin:10px 0;gap:12px}
.fld select{flex:1;max-width:65%}
.prompt{font-size:28px;font-weight:800;text-align:center;margin:22px 0 14px;overflow-wrap:anywhere}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ch{font:inherit;padding:14px 8px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;min-height:56px}
.ch.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.ch.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.fb{margin-top:12px;padding:12px;border-radius:12px;text-align:center;font-weight:700}
.fb.ok{color:var(--ok);background:var(--okbg)}
.fb.bad{color:var(--bad);background:var(--badbg)}
.center{text-align:center}
.mic.rec{background:var(--bad);color:#fff;animation:p 1s infinite}
@keyframes p{50%{opacity:.6}}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{text-align:center;margin:10px 0 0;padding:12px 4px}
.stat b{display:block;font-size:24px}
.stat span{font-size:12px;color:var(--sub)}
.chart{display:flex;height:120px;align-items:flex-end;gap:6px;margin-top:10px}
.chart div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.chart i{width:100%;background:var(--pri);border-radius:6px 6px 0 0;min-height:2px}
.chart small{color:var(--sub);font-size:11px}
details summary{cursor:pointer;font-weight:600}
h3{margin:0 0 6px}
</style>
</head>
<body>
<header><h1>📚 영어숙제 노트</h1><span class="sub" id="cnt"></span></header>
<main id="m"></main>
<nav>
  <button data-a="tab" data-v="hw"><span>✅</span>숙제</button>
  <button data-a="tab" data-v="words"><span>📖</span>단어장</button>
  <button data-a="tab" data-v="quiz"><span>✏️</span>퀴즈</button>
  <button data-a="tab" data-v="speak"><span>🎤</span>말하기</button>
  <button data-a="tab" data-v="stats"><span>📊</span>기록</button>
</nav>
<script>
const K='eng-hw-v1', $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=()=>ymd(new Date());
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>String(s).toLowerCase().replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim();
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

function seed(){
  const w=[['apple','사과'],['library','도서관'],['borrow','빌리다'],['careful','조심하는'],['weather','날씨'],['answer','대답하다'],['different','다른'],['remember','기억하다']];
  return{unit:'Unit 1',tasks:[{id:uid(),text:'Unit 1 단어 외우기',due:today(),done:false},{id:uid(),text:'단어 퀴즈 10문제 풀기',due:today(),done:false}],
    words:w.map(([en,ko])=>({id:uid(),unit:'Unit 1',en,ko,wrong:0})),log:{}};
}
function load(){try{const s=JSON.parse(localStorage.getItem(K));if(s&&Array.isArray(s.words))return s}catch(e){}return seed()}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function logAct(ok){const l=S.log[today()]||(S.log[today()]={n:0,c:0});l.n++;if(ok)l.c++;save()}
function say(t){if(!t||!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.9;speechSynthesis.speak(u)}
const units=()=>[...new Set([...S.words.map(w=>w.unit),S.unit])];
const unitSel=(sel,attr='data-c="unit"',all)=>`<select ${attr}>${all?'<option value="">전체 단원</option>':''}${units().map(u=>`<option ${u===sel?'selected':''}>${esc(u)}</option>`).join('')}${all?'':'<option value="__new">+ 새 단원</option>'}</select>`;
function dueLabel(d){const n=Math.round((Date.parse(d)-Date.parse(today()))/864e5);return n===0?'오늘':n===1?'내일':n<0?`${-n}일 지남`:`D-${n}`}

let S=load(), tab='hw', Q=null, P={i:0,custom:'',on:false,res:null};
try{tab=localStorage.getItem(K+'-tab')||'hw'}catch(e){}

const V={
hw(){
  const t=today(), list=[...S.tasks].sort((a,b)=>a.done-b.done||a.due.localeCompare(b.due));
  const done=S.tasks.filter(x=>x.done).length, pct=S.tasks.length?Math.round(done/S.tasks.length*100):0;
  return `<div class="card"><div class="row"><b>숙제 진행률</b><span class="sub">${done}/${S.tasks.length} 완료</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>
  <form class="card add" data-f="task"><input name="text" placeholder="숙제 내용 (예: Unit 2 단어 외우기)" required><input name="due" type="date" value="${t}" required><button class="btn">추가</button></form>
  ${list.map(x=>`<label class="item ${x.done?'done':''}"><input type="checkbox" data-c="toggle" data-v="${x.id}" ${x.done?'checked':''}><span class="grow">${esc(x.text)}</span><em class="due ${!x.done&&x.due<t?'late':''}">${dueLabel(x.due)}</em><button type="button" class="x" data-a="delTask" data-v="${x.id}" aria-label="삭제">✕</button></label>`).join('')||'<p class="empty">숙제가 없어요 🎉</p>'}`;
},
words(){
  const ws=S.words.filter(w=>w.unit===S.unit);
  return `<div class="card row">${unitSel(S.unit)}<span class="sub">${ws.length}개</span></div>
  <form class="card add" data-f="word"><input name="en" placeholder="영어" required autocapitalize="off" autocomplete="off"><input name="ko" placeholder="뜻" required autocomplete="off"><button class="btn">추가</button></form>
  <details class="card"><summary>여러 개 한 번에 붙여넣기</summary><form data-f="bulk"><textarea name="t" rows="5" placeholder="한 줄에 하나씩&#10;apple - 사과&#10;borrow : 빌리다&#10;weather 날씨"></textarea><button class="btn wide">추가하기</button></form></details>
  ${ws.map(w=>`<div class="item"><button class="ico" data-a="say" data-v="${esc(w.en)}" aria-label="발음 듣기">🔊</button><b>${esc(w.en)}</b><span class="grow sub">${esc(w.ko)}</span>${w.wrong?`<em class="badge">✗${w.wrong}</em>`:''}<button class="x" data-a="delWord" data-v="${w.id}" aria-label="삭제">✕</button></div>`).join('')||'<p class="empty">단어를 추가해 보세요</p>'}
  ${units().length>1?`<button class="btn ghost danger wide" data-a="delUnit">이 단원 삭제</button>`:''}`;
},
quiz(){
  if(Q)return Q.i<Q.list.length?qView():qEnd();
  return `<div class="card"><h3>단어 퀴즈</h3>
  <label class="fld">단원${unitSel(S.unit,'id="qu"',true)}</label>
  <label class="fld">유형<select id="qm"><option value="ko">영어 보고 뜻 고르기</option><option value="en">뜻 보고 영어 고르기</option><option value="sp">듣고 철자 쓰기</option></select></label>
  <label class="fld">문제<select id="qs"><option value="all">전체 단어</option><option value="wrong">틀린 단어만 (오답노트)</option></select></label>
  <button class="btn wide" data-a="qStart">시작 (최대 10문제)</button></div>`;
},
speak(){
  const ws=S.words.filter(w=>w.unit===S.unit);if(P.i>=ws.length)P.i=0;
  const w=ws[P.i], target=P.custom||(w?w.en:'');
  return `<div class="card row">${unitSel(S.unit)}<span class="sub">${!P.custom&&ws.length?`${P.i+1}/${ws.length}`:''}</span></div>
  <div class="card center">${target?`<p class="prompt">${esc(target)}</p>${!P.custom&&w?`<p class="sub">${esc(w.ko)}</p>`:''}`:'<p class="empty">단어가 없어요</p>'}
  <div class="row gap"><button class="btn ghost" data-a="say" data-v="${esc(target)}">🔊 듣기</button><button class="btn mic ${P.on?'rec':''}" data-a="mic">${P.on?'듣는 중…':'🎤 말하기'}</button><button class="btn ghost" data-a="pNext">다음 ▶</button></div>
  ${P.res?`<div class="fb ${P.res.ok?'ok':'bad'}">${P.res.ok?'완벽해요! 👏':'다시 해볼까요?'}<br><small>들린 말: “${esc(P.res.heard)}”</small></div>`:''}
  ${SR?'':'<p class="sub">이 브라우저는 음성 인식을 지원하지 않아요. (Chrome 권장)</p>'}</div>
  <form class="card add" data-f="custom"><input name="t" placeholder="연습할 문장 직접 입력" value="${esc(P.custom)}" autocomplete="off"><button class="btn">${P.custom?'변경':'설정'}</button>${P.custom?'<button type="button" class="btn ghost" data-a="clearCustom">단어로</button>':''}</form>`;
},
stats(){
  let streak=0;const d=new Date();if(!S.log[ymd(d)])d.setDate(d.getDate()-1);
  while(S.log[ymd(d)]){streak++;d.setDate(d.getDate()-1)}
  const tot=Object.values(S.log).reduce((a,l)=>({n:a.n+l.n,c:a.c+l.c}),{n:0,c:0});
  const last7=[...Array(7)].map((_,i)=>{const x=new Date();x.setDate(x.getDate()-6+i);return{n:(S.log[ymd(x)]||{n:0}).n,w:'일월화수목금토'[x.getDay()]}});
  const mx=Math.max(1,...last7.map(x=>x.n));
  const weak=S.words.filter(w=>w.wrong).sort((a,b)=>b.wrong-a.wrong).slice(0,5);
  return `<div class="grid3"><div class="card stat"><b>${streak}🔥</b><span>연속 학습일</span></div><div class="card stat"><b>${tot.n}</b><span>푼 문제</span></div><div class="card stat"><b>${tot.n?Math.round(tot.c/tot.n*100):0}%</b><span>정답률</span></div></div>
  <div class="card"><b>최근 7일</b><div class="chart">${last7.map(x=>`<div title="${x.n}문제"><i style="height:${x.n/mx*100}%"></i><small>${x.w}</small></div>`).join('')}</div></div>
  <div class="card"><b>자주 틀리는 단어</b>${weak.map(w=>`<div class="item flat"><button class="ico" data-a="say" data-v="${esc(w.en)}">🔊</button><b>${esc(w.en)}</b><span class="grow sub">${esc(w.ko)}</span><em class="badge">✗${w.wrong}</em></div>`).join('')||'<p class="sub">아직 없어요 👍</p>'}</div>
  <div class="card"><b>데이터</b><div class="row gap"><button class="btn ghost" data-a="exp">백업 저장</button><label class="btn ghost">불러오기<input type="file" accept=".json,application/json" data-c="imp" hidden></label><button class="btn ghost danger" data-a="reset">초기화</button></div></div>
  <p class="sub small">개인 학습용 비공식 앱으로, 학원 공식 앱과는 관련이 없습니다. 데이터는 이 기기에만 저장됩니다.</p>`;
}};

function qView(){
  const w=Q.list[Q.i], head=`<div class="row sub"><span>${Q.i+1} / ${Q.list.length}</span><span>점수 ${Q.score}</span></div><div class="bar"><i style="width:${Q.i/Q.list.length*100}%"></i></div>`;
  if(Q.mode==='sp')return `<div class="card">${head}<p class="prompt">${esc(w.ko)}</p><div class="center"><button class="btn ghost" data-a="say" data-v="${esc(w.en)}">🔊 다시 듣기</button></div>
    <form data-f="spell" class="add" style="margin-top:12px"><input name="a" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="들은 단어를 영어로 쓰세요" ${Q.ans?'disabled':''} value="${Q.ans?esc(Q.ans.v):''}"><button class="btn" ${Q.ans?'disabled':''}>확인</button></form>${fb(w)}</div>`;
  const key=Q.mode==='ko'?'ko':'en';
  if(!Q.ch){const others=shuffle([...new Set(S.words.map(x=>x[key]).filter(v=>v!==w[key]))]).slice(0,3);Q.ch=shuffle([w[key],...others])}
  return `<div class="card">${head}<p class="prompt">${esc(Q.mode==='ko'?w.en:w.ko)}${Q.mode==='ko'?` <button class="ico" data-a="say" data-v="${esc(w.en)}">🔊</button>`:''}</p>
  <div class="choices">${Q.ch.map((c,i)=>`<button class="ch ${Q.ans?(c===w[key]?'ok':c===Q.ans.v?'bad':''):''}" data-a="pick" data-v="${i}" ${Q.ans?'disabled':''}>${esc(c)}</button>`).join('')}</div>${fb(w)}</div>`;
}
function fb(w){
  if(!Q.ans)return '';
  return `<div class="fb ${Q.ans.ok?'ok':'bad'}">${Q.ans.ok?'정답! 🎉':`오답 — 정답: ${esc(w.en)} (${esc(w.ko)})`}</div><button class="btn wide" id="next" data-a="qNext">${Q.i+1<Q.list.length?'다음':'결과 보기'}</button>`;
}
function qEnd(){
  const p=Math.round(Q.score/Q.list.length*100);
  return `<div class="card center"><p class="prompt">${p>=90?'🏆':p>=60?'👍':'💪'} ${Q.score} / ${Q.list.length}</p><p class="sub">${p>=90?'훌륭해요!':p>=60?'잘했어요! 틀린 것만 다시 볼까요?':'괜찮아요, 다시 도전!'}</p>
  ${Q.wrongs.length?`<button class="btn wide" data-a="qRetry">틀린 ${Q.wrongs.length}문제 다시 풀기</button>`:''}<button class="btn ghost wide" data-a="qQuit">처음으로</button></div>`;
}
function answer(v,ok){
  const w=Q.list[Q.i];Q.ans={v,ok};
  if(ok){Q.score++;w.wrong=Math.max(0,(w.wrong||0)-1)}else{w.wrong=(w.wrong||0)+1;Q.wrongs.push(w)}
  logAct(ok);render();
}

const A={
  tab(v){tab=v;if(v!=='quiz'&&Q&&Q.i>=Q.list.length)Q=null;try{localStorage.setItem(K+'-tab',v)}catch(e){}render();scrollTo(0,0)},
  say:v=>say(v),
  delTask(id){S.tasks=S.tasks.filter(x=>x.id!==id);save();render()},
  delWord(id){S.words=S.words.filter(x=>x.id!==id);save();render()},
  delUnit(){if(!confirm(`'${S.unit}' 단원과 단어를 모두 삭제할까요?`))return;S.words=S.words.filter(w=>w.unit!==S.unit);S.unit=units().find(u=>u!==S.unit)||'Unit 1';save();render()},
  qStart(){
    const u=$('#qu').value, mode=$('#qm').value, src=$('#qs').value;
    const pool=S.words.filter(w=>(!u||w.unit===u)&&(src==='all'||w.wrong>0));
    if(!pool.length)return alert(src==='wrong'?'틀린 단어가 없어요! 👍':'단어가 없어요. 단어장에서 먼저 추가해 주세요.');
    if(mode!=='sp'&&S.words.length<2)return alert('객관식은 단어가 2개 이상 필요해요.');
    Q={list:shuffle(pool).slice(0,10),i:0,score:0,mode,ans:null,ch:null,wrongs:[]};render();if(mode==='sp')say(Q.list[0].en);
  },
  pick(i){if(Q.ans)return;const w=Q.list[Q.i],key=Q.mode==='ko'?'ko':'en',v=Q.ch[+i];answer(v,v===w[key])},
  qNext(){Q.i++;Q.ans=null;Q.ch=null;render();if(Q.mode==='sp'&&Q.i<Q.list.length)say(Q.list[Q.i].en)},
  qRetry(){Q={...Q,list:shuffle(Q.wrongs),i:0,score:0,wrongs:[],ans:null,ch:null};render();if(Q.mode==='sp')say(Q.list[0].en)},
  qQuit(){Q=null;render()},
  pNext(){P.i++;P.res=null;P.custom='';render()},
  clearCustom(){P.custom='';P.res=null;render()},
  mic(){
    if(!SR)return alert('이 브라우저는 음성 인식을 지원하지 않아요. Chrome에서 열어 주세요.');
    if(P.on)return;
    const target=P.custom||(S.words.filter(w=>w.unit===S.unit)[P.i]||{}).en;if(!target)return;
    const r=new SR();r.lang='en-US';r.interimResults=false;r.maxAlternatives=5;
    const sim=(a,b)=>{a=norm(a).split(' ');b=norm(b).split(' ');const s=new Set(a);return b.filter(x=>s.has(x)).length/Math.max(a.length,b.length)};
    r.onresult=e=>{const alts=[...e.results[0]].map(x=>x.transcript);const ok=alts.some(a=>sim(a,target)>=.8);P.res={ok,heard:alts[0]};logAct(ok)};
    r.onerror=e=>{P.res={ok:false,heard:e.error==='not-allowed'?'마이크 권한이 필요해요':'잘 안 들렸어요'}};
    r.onend=()=>{P.on=false;render()};
    P.on=true;P.res=null;render();r.start();
  },
  exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download=`영어숙제-${today()}.json`;a.click();URL.revokeObjectURL(a.href)},
  reset(){if(confirm('모든 숙제·단어·기록을 지울까요?')){S=seed();Q=null;save();render()}}
};
const C={
  toggle(id){const t=S.tasks.find(x=>x.id===id);if(t){t.done=!t.done;save();render()}},
  unit(v){if(v==='__new'){const n=(prompt('새 단원 이름','Unit '+(units().length+1))||'').trim();if(!n)return render();v=n}S.unit=v;P.i=0;P.res=null;P.custom='';save();render()},
  imp(_,el){const f=el.files[0];if(!f)return;f.text().then(t=>{const d=JSON.parse(t);if(!Array.isArray(d.words)||!Array.isArray(d.tasks))throw 0;S={unit:d.unit||'Unit 1',log:d.log||{},tasks:d.tasks,words:d.words};Q=null;save();render();alert('불러왔어요!')}).catch(()=>alert('올바른 백업 파일이 아니에요.'))}
};
const F={
  task(d){S.tasks.push({id:uid(),text:d.text.trim(),due:d.due||today(),done:false});save();render()},
  word(d){S.words.push({id:uid(),unit:S.unit,en:d.en.trim(),ko:d.ko.trim(),wrong:0});save();render();$('[name=en]').focus()},
  bulk(d){
    let n=0;
    for(const line of d.t.split('\n')){
      const m=line.match(/^\s*(.+?)\s*(?:\t|\s[-–—]\s|[:=,])\s*(.+?)\s*$/)||line.match(/^\s*([A-Za-z][A-Za-z'.\- ]*?)\s+([^A-Za-z].*?)\s*$/);
      if(m){S.words.push({id:uid(),unit:S.unit,en:m[1],ko:m[2],wrong:0});n++}
    }
    save();render();alert(n?`${n}개 단어를 추가했어요.`:'형식을 확인해 주세요. 예) apple - 사과');
  },
  spell(d){if(Q.ans)return;const w=Q.list[Q.i];answer(d.a||'',norm(d.a||'')===norm(w.en))},
  custom(d){P.custom=d.t.trim();P.res=null;render()}
};

function render(){
  $('#m').innerHTML=V[tab]();
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===tab));
  const left=S.tasks.filter(x=>!x.done).length;$('#cnt').textContent=left?`남은 숙제 ${left}개`:'숙제 끝! 🎉';
  if(tab==='quiz'&&Q){const n=$('#next');if(n)n.focus();else if(Q.mode==='sp')$('[name=a]')?.focus()}
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b){e.preventDefault();A[b.dataset.a](b.dataset.v,b)}});
document.addEventListener('change',e=>{const el=e.target.closest('[data-c]');if(el)C[el.dataset.c](el.dataset.v??el.value,el)});
document.addEventListener('submit',e=>{e.preventDefault();F[e.target.dataset.f](Object.fromEntries(new FormData(e.target)))});
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
