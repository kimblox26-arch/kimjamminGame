<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>해랑시 쓰나미</title>
<meta name="description" content="세계지도에서 쓰나미 발생 지점을 고르고 높이·크기를 정해, 바다를 건너 도시를 덮치는 쓰나미를 지도와 1인칭으로 지켜보는 재난 시뮬레이터">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
<script type="importmap">
{ "imports": { "three": "../vendor/three/three.module.min.js", "three/addons/": "../vendor/three/addons/" } }
</script>
</head>
<body class="m-world">
<canvas id="gl"></canvas>
<div id="touch-zone"></div>
<div id="labels"></div>
<div id="fx-under" class="fx"></div>
<div id="fx-vig" class="fx"></div>
<div id="fx-flash" class="fx"></div>
<div id="fx-shock" class="fx"></div>

<div id="loading">
  <div class="ld">
    <svg class="ld-mark" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30"/><path d="M6 38c6 0 6-5 12-5s6 5 12 5 6-5 12-5 6 5 12 5 6-5 8-5"/><path d="M10 28c3-9 10-14 20-14 6 0 11 2.5 14 7-6-1-11 2-12 7"/></svg>
    <h1>해랑시 쓰나미</h1>
    <div class="ld-bar"><i id="load-bar"></i></div>
    <p id="load-text">준비 중</p>
  </div>
</div>

<!-- 상단: 모드 전환 · 시간 -->
<header id="top">
  <nav id="modes" class="seg" aria-label="보기">
    <button data-mode="world" class="on"><span data-ic="globe"></span><b>세계</b></button>
    <button data-mode="city"><span data-ic="city"></span><b>도시</b></button>
    <button data-mode="fp"><span data-ic="person"></span><b>사람</b></button>
  </nav>
  <div id="timebox">
    <span id="clock">대기</span>
    <button id="btn-play" class="ib" title="재생/일시정지 (P)"><span data-ic="pause"></span></button>
    <button id="btn-speed" class="chip" title="속도">1×</button>
    <button id="btn-settings" class="ib" title="설정"><span data-ic="gear"></span></button>
  </div>
</header>

<div id="hint" class="pill"></div>
<div id="notice" class="pill notice hidden"></div>

<!-- 쓰나미 설정 카드 (터치 위치에 뜸) -->
<section id="editor" class="card hidden" aria-label="쓰나미 설정">
  <header class="ed-head">
    <div><h2>쓰나미 만들기</h2><p id="ed-where"></p></div>
    <button id="ed-close" class="ib" title="닫기"><span data-ic="close"></span></button>
  </header>
  <div id="ed-types" class="types"></div>
  <label class="sl"><span data-ic="height"></span><span class="nm">높이</span><input id="ed-height" type="range" min="0" max="100" value="45"><output id="ed-height-v"></output></label>
  <label class="sl"><span data-ic="size"></span><span class="nm">크기</span><input id="ed-size" type="range" min="0" max="100" value="55"><output id="ed-size-v"></output></label>
  <label class="sl" id="ed-dir-row"><span data-ic="compass"></span><span class="nm">방향</span><input id="ed-dir" type="range" min="0" max="179" value="30"><output id="ed-dir-v"></output></label>
  <p id="ed-calc" class="calc"></p>
  <div class="ed-btns"><button id="ed-cancel" class="btn">취소</button><button id="ed-go" class="btn primary"><span data-ic="wave"></span>발생</button></div>
</section>

<!-- 도시 표지 (세계지도) -->
<div id="city-pin" class="hidden">
  <button id="pin-btn"><span data-ic="pin"></span><b>해랑시</b><small id="pin-eta"></small></button>
  <div id="pin-menu" class="card hidden">
    <button data-go="city" class="btn"><span data-ic="city"></span>도시 지도</button>
    <button data-go="fp" class="btn"><span data-ic="person"></span>사람 모드</button>
  </div>
</div>

<!-- 도시 모드 보조 버튼 -->
<div id="city-tools">
  <button id="btn-3d" class="fab" title="3D로 보기"><span data-ic="cube"></span></button>
  <button id="btn-person" class="fab" title="사람 모드"><span data-ic="person"></span></button>
</div>

<!-- 1인칭 HUD -->
<div id="fp-hud">
  <div id="vitals" class="card"><span id="v-face"></span><span id="v-heart"><span data-ic="heart"></span><b id="v-bpm">72</b></span><i class="stam"><i id="v-stam"></i></i></div>
  <canvas id="minimap" width="180" height="180"></canvas>
  <div id="prompt" class="pill"></div>
</div>
<div id="touch-ui">
  <div id="joy"><div id="joy-knob"></div></div>
  <button id="t-run" class="fab" title="달리기"><span data-ic="run"></span></button>
  <button id="t-jump" class="fab" title="점프"><span data-ic="jump"></span></button>
  <button id="t-act" class="fab act" title="오르기"><span data-ic="climb"></span></button>
</div>

<!-- 재난문자 -->
<div id="phone" class="hidden"><div class="ph-h"><span data-ic="phone"></span>긴급재난문자</div><p class="ph-b"></p></div>

<!-- 설정 -->
<section id="settings" class="sheet hidden" aria-label="설정">
  <header class="ed-head"><h2>설정</h2><button id="set-close" class="ib" title="닫기"><span data-ic="close"></span></button></header>
  <label class="row"><span>그래픽 품질</span><select id="set-quality"></select></label>
  <label class="row"><span>소리</span><input id="set-vol" type="range" min="0" max="100" value="70"></label>
  <label class="row"><span>시각</span><input id="set-tod" type="range" min="5" max="21" step="0.25" value="15.5"><output id="set-tod-v"></output></label>
  <label class="row tg"><span>조기경보 (사이렌·재난문자)</span><input id="set-warn" type="checkbox" checked></label>
  <label class="row tg"><span>사람 감정 표시</span><input id="set-emo" type="checkbox" checked></label>
  <label class="row tg"><span>침수 흔적 표시</span><input id="set-flood" type="checkbox" checked></label>
  <button id="set-reset" class="btn wide"><span data-ic="reset"></span>처음부터 다시</button>
</section>

<div id="intro" class="overlay">
  <div class="card intro">
    <h2>해랑시 쓰나미</h2>
    <ol>
      <li><b>세계지도</b>에서 바다를 누르면 그 자리에 쓰나미 설정창이 열립니다. 높이·크기·방향을 정하고 <b>발생</b>을 누르세요.</li>
      <li>쓰나미는 실제 수심을 따라 바다를 건너 퍼집니다. <b>해랑시</b> 표지를 눌러 도시로 들어가 침수를 지켜보세요.</li>
      <li><b>사람 모드</b>에서는 도시 안의 한 사람이 됩니다. 높은 곳이나 고층 건물 옥상으로 대피하세요.</li>
    </ol>
    <button id="intro-go" class="btn primary wide">시작하기</button>
  </div>
</div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
