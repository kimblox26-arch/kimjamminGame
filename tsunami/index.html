<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>쓰나미 시뮬레이터 — 한반도</title>
<meta name="description" content="실제 한반도 지형·수심 데이터로 쓰나미가 퍼지고 육지를 덮치는 과정을 보여주는 웹 시뮬레이터">
<style>
  :root { --panel: rgba(12, 22, 40, .82); --line: rgba(160, 200, 255, .25); --accent: #ffd23f; --text: #eef4ff; --danger: #ff5a5a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #3f74c8; color: var(--text);
    font: 14px/1.35 system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #labels { pointer-events: none; }
  .top { position: fixed; top: 10px; left: 10px; right: 10px; display: flex; align-items: flex-start; gap: 10px; pointer-events: none; }
  .chip { font-weight: 800; letter-spacing: .04em; padding: 4px 10px; border-radius: 6px; background: rgba(0,0,0,.45); text-shadow: 0 1px 2px #000; }
  .title { flex: 1; text-align: center; font-weight: 800; font-size: 20px; text-shadow: 0 2px 4px #000; padding-top: 2px; }
  .height-box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; text-align: right; }
  .height-box small { display: block; font-size: 10px; letter-spacing: .08em; opacity: .75; }
  .height-box b { font-size: 22px; }
  .panel { position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); width: min(560px, calc(100% - 20px));
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; backdrop-filter: blur(6px); }
  .stats { display: flex; justify-content: space-between; gap: 8px; font-variant-numeric: tabular-nums; margin-bottom: 8px; }
  .stats div { flex: 1; text-align: center; }
  .stats small { display: block; opacity: .7; font-size: 11px; }
  .stats b { font-size: 16px; }
  .row { display: flex; align-items: center; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .row label { opacity: .8; font-size: 12px; min-width: 64px; }
  .row input[type=range] { flex: 1; min-width: 120px; accent-color: var(--accent); }
  button { font: inherit; color: var(--text); background: rgba(255,255,255,.08); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 10px; cursor: pointer; min-height: 34px; }
  button.on { background: var(--accent); color: #1a1a1a; border-color: var(--accent); font-weight: 700; }
  button:active { transform: scale(.97); }
  .val { min-width: 54px; text-align: right; font-variant-numeric: tabular-nums; }
  .hint { position: fixed; top: 72px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.55);
    padding: 6px 12px; border-radius: 20px; font-size: 13px; pointer-events: none; transition: opacity .4s; white-space: nowrap; }
  #busy { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(10,20,40,.35); font-size: 18px; font-weight: 700;
    text-shadow: 0 2px 4px #000; pointer-events: none; opacity: 0; transition: opacity .2s; }
  #busy.show { opacity: 1; }
  .src { margin-top: 6px; font-size: 10px; opacity: .55; text-align: center; }
  @media (max-width: 520px) {
    .title { font-size: 16px; }
    .title span { display: none; }
    .height-box b { font-size: 17px; }
    .panel { bottom: 8px; padding: 8px 10px; }
    .row label { min-width: 56px; }
    .row { gap: 4px; }
    button { padding: 6px 7px; }
  }
</style>
</head>
<body>
<canvas id="map"></canvas>
<canvas id="labels"></canvas>

<div class="top">
  <span class="chip">SIMULATION</span>
  <div class="title">Tsunami<span> · 한반도</span></div>
  <div class="height-box"><small>시작 파고 · START HEIGHT</small><b id="height-label">100 m / 328 ft</b></div>
</div>
<div class="hint" id="hint">바다를 탭하면 그 곳이 진원이 됩니다 · 드래그/휠/핀치로 이동·확대</div>

<div class="panel">
  <div class="stats">
    <div><small>경과 시간</small><b id="clock">00:00:00</b></div>
    <div><small>침수 면적</small><b id="area">0 km²</b></div>
    <div><small>침수 도시</small><b id="cities">0</b></div>
  </div>
  <div class="row">
    <label>시작 파고</label>
    <button data-h="10">10 m</button><button data-h="30">30 m</button><button data-h="100">100 m</button>
    <input id="height" type="range" min="1" max="300" step="1" value="100">
  </div>
  <div class="row">
    <label>내륙 감쇠</label>
    <input id="inland" type="range" min="0" max="3" step="0.1" value="1">
    <span class="val" id="inland-val">1.0 m/km</span>
    <button id="decay" class="on" title="진원에서 멀어질수록 파고가 낮아짐">거리 감쇠</button>
  </div>
  <div class="row">
    <button id="play">⏸ 일시정지</button>
    <button id="restart">↺ 처음부터</button>
    <span style="flex:1"></span>
    <button data-speed="0.5">×0.5</button><button data-speed="1" class="on">×1</button><button data-speed="2">×2</button><button data-speed="4">×4</button>
  </div>
  <div class="src">지형·수심: AWS Terrain Tiles (SRTM·GMTED·ETOPO1) · 단순화한 모델로, 실제 재난 예측이 아닙니다</div>
</div>
<div id="busy">계산 중…</div>

<script type="module" src="./tsunami.js"></script>
</body>
</html>
