<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tsunami South Korea — 세 가지 파고 시뮬레이션</title>
<meta name="description" content="남한에 100 m · 500 m · 1000 m 쓰나미가 덮친다면? 실제 지형 데이터로 만든 지리 시뮬레이션">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Noto+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #4172bd; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #controls { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 8px;
    transition: opacity .4s; font: 600 14px "Noto Sans", system-ui, sans-serif; }
  #controls.hide { opacity: 0; pointer-events: none; }
  #controls button, #controls a { color: #fff; background: rgba(15, 25, 45, .75); border: 1px solid rgba(255,255,255,.25);
    border-radius: 20px; padding: 8px 14px; font: inherit; cursor: pointer; text-decoration: none; white-space: nowrap; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #fff;
    font: 700 18px "Noto Sans", system-ui, sans-serif; text-shadow: 0 2px 4px #000; }
</style>
</head>
<body>
<canvas id="map"></canvas>
<canvas id="overlay"></canvas>
<div id="loading">지형 불러오는 중…</div>
<div id="controls" class="hide">
  <button id="play">⏸</button>
  <button id="replay">↺ 처음부터</button>
  <a href="./lab.html">🔬 직접 해보기</a>
  <a href="./world.html">🌍 세계 지도</a>
</div>
<script type="module" src="./video.js"></script>
</body>
</html>
