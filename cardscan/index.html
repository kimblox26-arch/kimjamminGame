<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>카드 스캐너</title>
<meta name="description" content="포켓몬 카드를 카메라로 찍으면 카드 정보와 시세를 찾아주는 웹앱">
<meta name="theme-color" content="#1f6feb">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>📷 카드 스캐너</h1>
  <select id="lang" aria-label="카드 언어">
    <option value="ko">한국어 카드</option>
    <option value="en">English</option>
    <option value="ja">日本語</option>
  </select>
</header>

<nav class="tabs">
  <button class="tab on" data-view="scan">스캔</button>
  <button class="tab" data-view="col">내 컬렉션 <span id="colCount">0</span></button>
</nav>

<main>
  <section id="scan" class="view on">
    <div class="cam">
      <video id="video" playsinline muted></video>
      <div class="guide" id="guide"><span>카드를 틀에 맞춰주세요</span></div>
      <button id="camStart" class="camStart">카메라 켜기</button>
    </div>
    <div class="row">
      <button id="shot" class="primary">📸 찍어서 찾기</button>
      <label class="btn">🖼 사진 올리기<input id="file" type="file" accept="image/*" hidden></label>
    </div>
    <form id="searchForm" class="row">
      <input id="q" type="search" placeholder="이름 또는 번호로 검색 (예: 피카츄, 025/198)" autocomplete="off">
      <button class="btn">검색</button>
    </form>
    <p id="status" class="status" role="status"></p>
    <div id="results" class="grid"></div>
  </section>

  <section id="col" class="view">
    <div id="colSummary" class="summary"></div>
    <div id="colList" class="grid"></div>
  </section>
</main>

<div id="zoom" class="zoom" hidden><img alt=""></div>

<footer>비공식 팬 제작 도구 · 카드 데이터: TCGdex · 시세는 참고용</footer>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
