<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOD-UI: 게임 설정 창 테스트</title>
<link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/game2.css"><link rel="stylesheet" href="../css/mod.css">
<style>#stage{background:#2c5250}</style></head>
<body><div id="stage"></div>
<script type="module">
// 서버 없이 openGameSettings 를 띄우고, onChange 는 서버처럼 sanitize/applyPreset 해서 refresh 로 돌려줌
import { defaultSettings, sanitizeSettings, applyPreset, PRESETS, CUSTOM, SETTINGS, HNS_SETTINGS } from '../js/shared/data.js';
import { openGameSettings } from '../js/ui/gamesettings.js';
const q = new URLSearchParams(location.search);
const fit = () => (document.getElementById('stage').style.transform = `translate(-50%,-50%) scale(${Math.min(innerWidth / 1600, innerHeight / 720)})`);
addEventListener('resize', fit); fit();
let s = defaultSettings();
if (q.get('hns')) s = applyPreset('손전등', { ...s, gameType: 'hns' });
if (q.get('roles')) s = applyPreset('다양한 역할', s);
const players = [{ id: 'a', name: '빨강이', look: { color: 0 } }, { id: 'b', name: '파랑이', look: { color: 1, hat: 'tophat' } }, { id: 'c', name: '라임', look: { color: 11 } }];
window.patches = [];
const gs = openGameSettings({ settings: s, editable: q.get('edit') !== '0', players, onChange: p => {
  window.patches.push(p);
  // 서버 applySettings 흉내
  let next;
  if (Object.prototype.hasOwnProperty.call(PRESETS, p.preset) && (p.preset !== s.preset || Object.keys(p).length === 1)) next = applyPreset(p.preset, s);
  else {
    next = sanitizeSettings({ ...p, preset: undefined }, s);
    const changed = [...SETTINGS, ...HNS_SETTINGS].some(d => next[d[0]] !== s[d[0]]) || JSON.stringify(next.roleSet) !== JSON.stringify(s.roleSet);
    if (next.gameType !== s.gameType && s.preset !== CUSTOM) next.preset = next.gameType === 'hns' ? (next.flashlight ? '손전등' : '피치 다크') : (next.roles ? '다양한 역할' : '핵심 설정');
    else if (changed) next.preset = CUSTOM;
  }
  s = next;
  setTimeout(() => gs.refresh(s), 60);
} });
window.gs = gs; window.cur = () => s;
</script></body></html>
