<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SPIDER ARMS</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#7fb8f0; font-family:Fredoka,sans-serif; color:#fff; user-select:none; -webkit-user-select:none; touch-action:none; }
  canvas { display:block; }
  .stroke { text-shadow:0 3px 0 #0a2a4a, 2px 0 0 #0a2a4a, -2px 0 0 #0a2a4a, 0 -2px 0 #0a2a4a; }
  #pain { position:fixed; inset:0; pointer-events:none; opacity:0; z-index:2; background:radial-gradient(ellipse at center, transparent 30%, #a0001ad0 100%); }
  #awakenBtn { position:fixed; left:50%; bottom:26px; transform:translateX(-50%); z-index:3; font:700 26px Fredoka; color:#fff; padding:12px 36px; border-radius:40px;
               border:3px solid #fff; background:radial-gradient(circle,#ff4a6a,#7a0018); box-shadow:0 0 24px #ff2a4a, 0 0 60px #ff2a4a88; animation:pulse 1.1s infinite; cursor:pointer; }
  #awakenBtn small { font-size:15px; opacity:.85; }
  @keyframes pulse { 50% { scale:1.07; box-shadow:0 0 36px #ff2a4a, 0 0 100px #ff2a4acc; } }
  body.touch #awakenBtn { left:auto; right:20px; bottom:140px; transform:none; padding:16px 22px; }
  #toast { position:fixed; top:22%; left:50%; transform:translateX(-50%) scale(.6); font:700 clamp(30px,6vw,60px) Fredoka; color:#ffe14a; opacity:0; transition:.25s; z-index:2; white-space:nowrap; }
  #toast.on { opacity:1; transform:translateX(-50%) scale(1); }
  #fade { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; transition:opacity .2s; z-index:2; }
  .ov { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:18px;
        background:#0b3b6a99; backdrop-filter:blur(3px); z-index:5; text-align:center; padding:16px; overflow-y:auto; }
  .ov h1 { font:700 clamp(40px,9vw,90px) Fredoka; color:#ffd400; }
  .keys { display:grid; grid-template-columns:auto auto; gap:6px 18px; font-size:17px; text-align:left; background:#ffffff22; border:2px solid #ffffff55; padding:14px 22px; border-radius:14px; }
  .keys b { color:#ffd400; }
  .btn { font:700 24px Fredoka; padding:12px 50px; color:#fff; background:linear-gradient(#5cd65c,#2e9e2e); border:3px solid #1d5e1d; border-radius:14px; cursor:pointer; box-shadow:0 5px 0 #1d5e1d; }
  .hidden { display:none !important; }
  .touch-only { display:none; }
  body.touch .touch-only { display:grid; }
  body.touch .pc-only { display:none; }
  #stick { position:fixed; width:120px; height:120px; margin:-60px 0 0 -60px; border-radius:50%; background:#ffffff33; border:3px solid #ffffff88; pointer-events:none; opacity:0; transition:opacity .15s; z-index:3; }
  #stick.on { opacity:1; }
  #knob { position:absolute; left:50%; top:50%; width:52px; height:52px; margin:-26px; border-radius:50%; background:#ffffffcc; }
  #jumpBtn { position:fixed; right:28px; bottom:34px; width:90px; height:90px; border-radius:50%; background:#ffffff44; border:3px solid #ffffffaa;
             font:700 18px Fredoka; color:#fff; display:none; align-items:center; justify-content:center; z-index:3; }
  body.touch #jumpBtn { display:flex; }
  #jumpBtn:active { background:#ffffffaa; }
</style>
<script type="importmap">
{ "imports": { "three": "../vendor/three/three.module.min.js", "three/addons/": "../vendor/three/addons/" } }
</script>
</head>
<body>
<canvas id="gl"></canvas>
<div id="pain"></div>
<div id="toast" class="stroke"></div>
<div id="fade"></div>
<div id="stick"><div id="knob"></div></div>
<div id="jumpBtn" class="stroke">JUMP</div>
<button id="awakenBtn" class="stroke">각성 <small class="pc-only">(E)</small></button>

<div class="ov" id="start">
  <h1 class="stroke">SPIDER ARMS</h1>
  <div class="keys pc-only">
    <b>WASD</b><span>이동</span>
    <b>SHIFT</b><span>달리기</span>
    <b>SPACE</b><span>점프 / 벽에서 뛰어내리기</span>
    <b>E / 각성 버튼</b><span>등에서 거미다리 8개가 돋아남</span>
    <b>벽 쪽으로 이동</b><span>(각성 후) 거미다리로 벽 기어오르기</span>
    <b>마우스 / 휠</b><span>카메라 회전 / 줌</span>
  </div>
  <div class="keys touch-only">
    <b>왼쪽 화면 드래그</b><span>이동 (끝까지 밀면 달리기)</span>
    <b>각성 버튼</b><span>등에서 거미다리 8개가 돋아남</span>
    <b>벽 쪽으로 이동</b><span>(각성 후) 거미다리로 벽 기어오르기</span>
    <b>오른쪽 화면 드래그</b><span>카메라 회전</span>
    <b>두 손가락 핀치</b><span>줌</span>
    <b>JUMP 버튼</b><span>점프</span>
  </div>
  <button class="btn" id="play">플레이</button>
</div>
<div class="ov hidden" id="clear">
  <h1 class="stroke">클리어!</h1>
  <button class="btn" id="again">다시 하기</button>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
