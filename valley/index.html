<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>계곡 물막이</title>
<meta name="description" content="돌을 직접 주워 쌓고 진흙으로 틈을 메워 계곡물을 막는 물리 샌드박스">
<link rel="stylesheet" href="./style.css?v=20261112a">
<script type="importmap">
{
  "imports": {
    "three": "../vendor/three/three.module.min.js",
    "three/addons/": "../vendor/three/addons/",
    "rapier": "../vendor/rapier/rapier.es.js"
  }
}
</script>
</head>
<body>
<canvas id="gl"></canvas>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-hand" viewBox="0 0 24 24"><path d="M8 12.5V6.2a1.4 1.4 0 0 1 2.8 0V11m0-5.8V4.4a1.4 1.4 0 0 1 2.8 0V11m0-5.2a1.4 1.4 0 0 1 2.8 0V11.5m0-3.6a1.4 1.4 0 0 1 2.8 0v5.6A7.5 7.5 0 0 1 11.7 21h-.6a6.3 6.3 0 0 1-5.2-2.8l-2.6-4a1.5 1.5 0 0 1 2.4-1.8L8 14.6"/></symbol>
  <symbol id="i-shovel" viewBox="0 0 24 24"><path d="M9.5 2.5h5M12 2.5v9.5"/><path d="M8 12h8v4.5a4 4 0 0 1-8 0z"/></symbol>
  <symbol id="i-rain" viewBox="0 0 24 24"><path d="M7 15.5a4 4 0 0 1-.3-8 5.5 5.5 0 0 1 10.6 1.4 3.3 3.3 0 0 1 .2 6.6z"/><path d="M8.5 18.5l-1 2M12.5 18.5l-1 2M16.5 18.5l-1 2"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13.5 2.5L5 13.5h6l-1 8 8.5-11h-6z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 5.5v13M15 5.5v13"/></symbol>
  <symbol id="i-jump" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
  <symbol id="i-throw" viewBox="0 0 24 24"><path d="M5 19L19 5M10 5h9v9"/></symbol>
  <symbol id="i-rot" viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4v4.5H15"/></symbol>
</svg>

<section id="start" class="screen">
  <div class="card">
    <h1>계곡 물막이</h1>
    <p class="sub">돌을 쌓고 진흙으로 틈을 메워 계곡물을 막아보세요</p>
    <div class="seg" id="quality" role="radiogroup" aria-label="그래픽">
      <button data-q="ultra" role="radio">초고화질</button>
      <button data-q="high" role="radio">고화질</button>
      <button data-q="perf" role="radio">최적화</button>
    </div>
    <button id="go" class="btn">시작</button>
    <div class="prog"><div id="progbar"></div></div>
  </div>
</section>

<section id="pause" class="screen hidden">
  <div class="card small">
    <h2 id="pauseT">일시정지</h2>
    <button id="resume" class="btn">계속</button>
    <button id="restart" class="btn ghost">처음부터</button>
  </div>
</section>

<div id="hud" class="hidden">
  <div id="meter">
    <div class="mtop"><span>막은 물</span><b id="mPct">—</b></div>
    <div class="mbar"><div id="mFill"></div></div>
    <div class="msub" id="mSub"></div>
  </div>
  <div id="cross"></div>
  <div id="tag"></div>
  <div id="toast"></div>
  <nav id="bar">
    <button class="tb on" data-t="hand" title="손 (1)"><svg><use href="#i-hand"/></svg><kbd>1</kbd></button>
    <button class="tb" data-t="shovel" title="삽 · 진흙 (2)"><svg><use href="#i-shovel"/></svg><kbd>2</kbd><i class="mud"><i id="mud"></i></i></button>
    <span class="sep"></span>
    <button class="tb" id="bRain" title="비 (3)"><svg><use href="#i-rain"/></svg><kbd>3</kbd></button>
    <button class="tb" id="bPerf" title="최적화 모드 (4)"><svg><use href="#i-bolt"/></svg><kbd>4</kbd></button>
    <button class="tb" id="bPause" title="일시정지 (Esc)"><svg><use href="#i-pause"/></svg></button>
  </nav>
  <div id="fps"></div>
</div>

<div id="touch" class="hidden">
  <div id="joy"><div id="knob"></div></div>
  <div id="tbtns">
    <button id="tSec" class="rb"><svg><use href="#i-throw"/></svg></button>
    <button id="tRot" class="rb"><svg><use href="#i-rot"/></svg></button>
    <button id="tJump" class="rb"><svg><use href="#i-jump"/></svg></button>
    <button id="tPrim" class="rb big"><svg><use href="#i-hand"/></svg></button>
  </div>
</div>

<script type="module" src="./js/main.js?v=20261112a"></script>
</body>
</html>
