<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>체스</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg class="defs" aria-hidden="true">
  <defs>
    <linearGradient id="gw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#ece3d3"/>
      <stop offset="1" stop-color="#c4b49c"/>
    </linearGradient>
    <linearGradient id="gb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6e655c"/>
      <stop offset="0.5" stop-color="#3a332d"/>
      <stop offset="1" stop-color="#17130f"/>
    </linearGradient>
  </defs>
</svg>

<main class="stage">
  <div class="frame">
    <div class="board" id="board">
      <div class="layer squares" id="squares"></div>
      <div class="layer shade"></div>
      <div class="layer marks" id="marks"></div>
      <div class="layer pieces" id="pieces"></div>
      <div class="layer promo" id="promo" hidden></div>
      <div class="layer end" id="end" hidden>
        <div class="end-card">
          <strong id="endTitle"></strong>
          <span id="endText"></span>
          <small>눌러서 다시 시작</small>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="js/pieces.js"></script>
<script src="js/engine.js"></script>
<script src="js/main.js"></script>
</body>
</html>
