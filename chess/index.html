<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>체스</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg class="defs" aria-hidden="true">
  <defs>
    <linearGradient id="gw" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9d3c9"/>
      <stop offset="0.3" stop-color="#ffffff"/>
      <stop offset="0.68" stop-color="#e8e3da"/>
      <stop offset="1" stop-color="#b3aa9c"/>
    </linearGradient>
    <linearGradient id="gb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b3632"/>
      <stop offset="0.3" stop-color="#6a635d"/>
      <stop offset="0.68" stop-color="#3a3531"/>
      <stop offset="1" stop-color="#1a1715"/>
    </linearGradient>
    <radialGradient id="gws" cx="0.36" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#e6e0d6"/>
      <stop offset="1" stop-color="#a99f90"/>
    </radialGradient>
    <radialGradient id="gbs" cx="0.36" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#77706a"/>
      <stop offset="0.5" stop-color="#3d3834"/>
      <stop offset="1" stop-color="#161311"/>
    </radialGradient>
  </defs>
</svg>

<main class="stage">
  <div class="frame">
    <div class="board" id="board">
      <div class="layer squares" id="squares"></div>
      <div class="layer shade"></div>
      <div class="layer marks" id="marks"></div>
      <div class="layer pieces" id="pieces"></div>
      <div class="layer promo" id="promo" hidden></div>
      <div class="layer veil" id="veil">
        <div class="veil-card">
          <strong id="veilTitle">체스</strong>
          <span id="veilText">판을 눌러 시작</span>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="js/pieces.js"></script>
<script src="js/engine.js"></script>
<script src="js/sound.js"></script>
<script src="js/main.js"></script>
</body>
</html>
