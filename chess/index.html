<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>체스</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg class="defs" aria-hidden="true">
  <defs>
    <linearGradient id="gw" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f4f4f4"/>
      <stop offset="1" stop-color="#cdcdcd"/>
    </linearGradient>
    <linearGradient id="gb" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#5e5e5e"/>
      <stop offset="0.45" stop-color="#3c3c3c"/>
      <stop offset="1" stop-color="#232323"/>
    </linearGradient>
    <radialGradient id="gws" cx="0.36" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#ececec"/>
      <stop offset="1" stop-color="#bdbdbd"/>
    </radialGradient>
    <radialGradient id="gbs" cx="0.36" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#6c6c6c"/>
      <stop offset="0.55" stop-color="#3b3b3b"/>
      <stop offset="1" stop-color="#1e1e1e"/>
    </radialGradient>
  </defs>
</svg>

<main class="stage">
  <div class="frame">
    <div class="board" id="board">
      <div class="layer squares" id="squares"></div>
      <div class="layer marks" id="marks"></div>
      <div class="layer pieces" id="pieces"></div>
      <div class="layer promo" id="promo" hidden></div>
      <div class="layer veil" id="veil">
        <div class="veil-card">
          <strong id="veilTitle">체스</strong>
          <span id="veilText">판을 눌러 시작</span>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="js/pieces.js"></script>
<script src="js/engine.js"></script>
<script src="js/sound.js"></script>
<script src="js/main.js"></script>
</body>
</html>
