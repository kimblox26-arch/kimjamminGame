<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const glc = document.getElementById('gl');
const MOBILE = matchMedia('(pointer: coarse)').matches;

// ---------- 상수 (게임 로직 단위: 1 = 3D 0.1) ----------
const FACE_W = 50, NH_W = 22, NH_H = 7, SC = 0.1, MAX_LIFT = 280;
const REACH = FACE_W / 2 + NH_W / 2, V_MIN = 200, V_MAX = 4000, K = 0.014;
const W = 420, woodTop = 372;
const R = 26, TOP_Y = 38;                         // 그루터기 반지름 / 윗면 높이
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.random() * a.length | 0];
const X3 = x => (x - W / 2) * SC, Y3 = y => TOP_Y + (woodTop - y) * SC;
const rf = th => 1 + 0.035 * Math.sin(3 * th + 1) + 0.02 * Math.sin(5 * th + 2) + 0.01 * Math.sin(11 * th + 0.5);

// ---------- 렌더러 & 후처리 ----------
const renderer = new THREE.WebGLRenderer({ canvas: glc, antialias: false, powerPreference: 'high-performance' });
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
const scene = new THREE.Scene();
const HAZE = new THREE.Color(0x8dacd8);
scene.fog = new THREE.Fog(HAZE, 220, 1150);
const camera = new THREE.PerspectiveCamera(46, 1, 0.5, 2500);
const ANISO = renderer.capabilities.getMaxAnisotropy();

const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: MOBILE ? 2 : 4 }));
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(256, 256), 0.28, 0.5, 1.4));
composer.addPass(new OutputPass());
composer.addPass(new ShaderPass({
  uniforms: { tDiffuse: { value: null } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform sampler2D tDiffuse; varying vec2 vUv;
    void main(){
      vec4 c = texture2D(tDiffuse, vUv); vec3 col = c.rgb;
      float l = dot(col, vec3(0.299, 0.587, 0.114));
      col = mix(vec3(l), col, 1.1);
      col = (col - 0.5) * 1.04 + 0.5;
      vec2 d = (vUv - 0.5) * vec2(1.0, 0.85);
      col *= mix(0.74, 1.0, smoothstep(0.82, 0.22, length(d)));
      gl_FragColor = vec4(col, c.a);
    }`
}));

// ---------- 유틸 ----------
const CTX = { willReadFrequently: true };
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function tex(cv, rx = 1, ry = 1, srgb = true) {
  const t = new THREE.CanvasTexture(cv);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = ANISO; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry);
  return t;
}
function lum(cv) {
  const d = cv.getContext('2d', CTX).getImageData(0, 0, cv.width, cv.height).data, L = new Float32Array(cv.width * cv.height);
  for (let i = 0; i < L.length; i++) L[i] = (d[i * 4] * 0.3 + d[i * 4 + 1] * 0.59 + d[i * 4 + 2] * 0.11) / 255;
  return L;
}
function normalTex(cv, strength, rx = 1, ry = 1, L = lum(cv)) {
  const w = cv.width, h = cv.height, out = mkCanvas(w, h), og = out.getContext('2d', CTX), id = og.createImageData(w, h), o = id.data;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const xl = (x + w - 1) % w, xr = (x + 1) % w, yu = (y + h - 1) % h, yd = (y + 1) % h;
    const nx = -(L[y * w + xr] - L[y * w + xl]) * strength, ny = (L[yd * w + x] - L[yu * w + x]) * strength;
    const k = 1 / Math.hypot(nx, ny, 1), i = (y * w + x) * 4;
    o[i] = (nx * k * 0.5 + 0.5) * 255; o[i + 1] = (ny * k * 0.5 + 0.5) * 255; o[i + 2] = (k * 0.5 + 0.5) * 255; o[i + 3] = 255;
  }
  og.putImageData(id, 0, 0);
  return tex(out, rx, ry, false);
}
const NS = 256, NV = new Float32Array(NS * NS).map(() => Math.random());
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y); let xf = x - xi, yf = y - yi;
  xf = xf * xf * (3 - 2 * xf); yf = yf * yf * (3 - 2 * yf);
  const g = (i, j) => NV[(j & 255) * NS + (i & 255)];
  const a = g(xi, yi) + (g(xi + 1, yi) - g(xi, yi)) * xf, b = g(xi, yi + 1) + (g(xi + 1, yi + 1) - g(xi, yi + 1)) * xf;
  return a + (b - a) * yf;
}
function fbm(x, y, o = 5) { let a = 0.5, s = 0; for (let i = 0; i < o; i++) { s += a * vnoise(x, y); x *= 2.03; y *= 2.03; a *= 0.5; } return s; }

// ---------- 하늘 ----------
const SUN_DIR = new THREE.Vector3(-0.27, 0.15, -0.95).normalize();
const skyMat = new THREE.ShaderMaterial({
  uniforms: { sunDir: { value: SUN_DIR } }, side: THREE.BackSide, depthWrite: false,
  vertexShader: `varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform vec3 sunDir; varying vec3 vDir;
    void main(){
      vec3 d = normalize(vDir); float h = clamp(d.y, 0.0, 1.0);
      vec3 zen = vec3(0.015, 0.09, 0.48), hor = vec3(0.2, 0.42, 0.82);
      vec3 col = mix(hor, zen, pow(h, 0.45));
      col = mix(col, vec3(0.55, 0.68, 0.86), exp(-h * 30.0) * 0.4);
      if (d.y < 0.0) col = mix(vec3(0.5, 0.6, 0.75), vec3(0.3, 0.32, 0.3), clamp(-d.y * 4.0, 0.0, 1.0));
      float s = max(dot(d, sunDir), 0.0);
      col += vec3(1.0, 0.86, 0.62) * (pow(s, 12.0) * 0.22 + pow(s, 260.0) * 1.6);
      col += vec3(1.0, 0.97, 0.9) * smoothstep(0.99955, 0.99972, s) * 30.0;
      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`
});
const skyGeo = new THREE.SphereGeometry(1000, 48, 24);
scene.add(new THREE.Mesh(skyGeo, skyMat));
{
  const s = new THREE.Scene(); s.add(new THREE.Mesh(skyGeo, skyMat));
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(s, 0.02, 0.1, 3000).texture; pm.dispose();
}

// 뭉게구름 (fBm 노이즈)
const clouds = new THREE.Group(); scene.add(clouds);
{
  const texs = [];
  for (let k = 0; k < 5; k++) {
    const w = 384, h = 192, c = mkCanvas(w, h), g = c.getContext('2d', CTX), id = g.createImageData(w, h), d = id.data;
    const ox = rand(0, 200), oy = rand(0, 200), flat = rand(4, 8);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const nx = (x - w / 2) / (w / 2), ny = (y - h * 0.64) / (h * 0.5);
      const shape = 1 - (nx * nx + (ny < 0 ? ny * ny * 1.1 : ny * ny * flat));
      const n = fbm(ox + x / 46, oy + y / 46);
      const dens = n + shape * 0.85 - 0.86;
      const a = clamp(dens * 3.2, 0, 1);
      const light = clamp(0.78 - ny * 0.28 + (n - 0.5) * 0.35, 0.55, 1.08);
      const i = (y * w + x) * 4;
      d[i] = 255 * Math.min(1, light); d[i + 1] = 255 * Math.min(1, light * 1.0); d[i + 2] = 255 * Math.min(1, light * 1.05 + 0.03); d[i + 3] = a * 255;
    }
    g.putImageData(id, 0, 0);
    const t = tex(c); t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping; texs.push(t);
  }
  for (let i = 0; i < 16; i++) {
    const a = rand(-1.4, 1.4), e = i < 11 ? rand(0.03, 0.15) : rand(0.15, 0.4), D = 780;
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: pick(texs), transparent: true, depthWrite: false, fog: false, color: new THREE.Color(1.3, 1.3, 1.3), opacity: rand(0.8, 1) }));
    sp.position.set(Math.sin(a) * Math.cos(e) * D, Math.sin(e) * D, -Math.cos(a) * Math.cos(e) * D);
    const w = rand(170, 380) * (1 - e * 0.6); sp.scale.set(w, w / 2, 1);
    clouds.add(sp);
  }
}

// ---------- 조명 ----------
scene.add(new THREE.HemisphereLight(0xbcd6ff, 0x5a4630, 0.6));
const sun = new THREE.DirectionalLight(0xfff0d8, 3.2);
const LIGHT_DIR = new THREE.Vector3(-0.62, 0.74, -0.06).normalize();
sun.position.copy(LIGHT_DIR).multiplyScalar(140).add(new THREE.Vector3(0, TOP_Y, 0));
sun.target.position.set(0, TOP_Y * 0.6, 0); scene.add(sun.target);
sun.castShadow = true; sun.shadow.mapSize.setScalar(MOBILE ? 2048 : 4096);
Object.assign(sun.shadow.camera, { left: -60, right: 60, top: 60, bottom: -60, near: 20, far: 320 });
sun.shadow.bias = -0.0003; sun.shadow.normalBias = 0.05;
scene.add(sun);

// ---------- 텍스처 생성 ----------
function barkCanvas(w, h, lichen) {
  const c = mkCanvas(w, h), g = c.getContext('2d', CTX);
  g.fillStyle = '#5e5249'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 12000; i++) {
    const v = rand(60, 150) | 0; g.fillStyle = `rgba(${v},${v * 0.9 | 0},${v * 0.8 | 0},.2)`;
    g.fillRect(Math.random() * w, Math.random() * h, rand(1, 4), rand(2, 9));
  }
  const wavy = (x0, lw, col, amp, fr) => {
    g.strokeStyle = col; g.lineWidth = lw;
    for (const off of [-w, 0, w]) {
      g.beginPath(); const ph = Math.random() * 6;
      for (let y = -10; y <= h + 10; y += 5) { const x = x0 + off + Math.sin(y * fr + ph) * amp + Math.sin(y * fr * 3.1) * amp * 0.3; y < 0 ? g.moveTo(x, y) : g.lineTo(x, y); }
      g.stroke();
    }
  };
  for (let i = 0; i < 90; i++) wavy(Math.random() * w, rand(2, 8), `rgba(26,20,16,${rand(0.35, 0.6)})`, rand(3, 10), rand(0.01, 0.03));
  for (let i = 0; i < 70; i++) wavy(Math.random() * w, rand(1, 3), `rgba(170,160,150,${rand(0.2, 0.4)})`, rand(3, 9), rand(0.01, 0.03));
  for (let i = 0; i < 50; i++) {
    g.strokeStyle = 'rgba(15,10,8,.55)'; g.lineWidth = rand(1, 3);
    const x = Math.random() * w, y = Math.random() * h; g.beginPath(); g.moveTo(x, y); g.lineTo(x + rand(6, 20), y + rand(-3, 3)); g.stroke();
  }
  for (let i = 0; i < lichen; i++) {
    const cx = Math.random() * w, cy = Math.random() * h;
    for (let j = 0; j < 50; j++) {
      g.fillStyle = `rgba(${rand(170, 205) | 0},${rand(178, 205) | 0},${rand(150, 172) | 0},${rand(0.3, 0.75)})`;
      g.beginPath(); g.arc(cx + rand(-20, 20), cy + rand(-13, 13), rand(1, 4), 0, 7); g.fill();
    }
  }
  return c;
}

const CUT_PX = 1024, CUT_S = (CUT_PX / 2) / (R * 1.07);
function cutCanvas() {
  const c = mkCanvas(CUT_PX, CUT_PX), g = c.getContext('2d', CTX), m = CUT_PX / 2;
  const path = (f, wob = 0, ph = 0) => {
    g.beginPath();
    for (let i = 0; i <= 160; i++) {
      const th = i / 160 * Math.PI * 2, r = R * rf(th) * f * (1 + wob * Math.sin(th * 6 + ph)) * CUT_S;
      const x = m + Math.sin(th) * r, y = m + Math.cos(th) * r;
      i ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.closePath();
  };
  g.fillStyle = '#3a3029'; g.fillRect(0, 0, CUT_PX, CUT_PX);
  path(1); g.save(); g.clip();
  g.fillStyle = '#3d332b'; g.fillRect(0, 0, CUT_PX, CUT_PX);
  for (let i = 0; i < 3500; i++) { const v = rand(30, 100) | 0; g.fillStyle = `rgba(${v},${v * 0.85 | 0},${v * 0.7 | 0},.55)`; g.fillRect(Math.random() * CUT_PX, Math.random() * CUT_PX, rand(2, 5), rand(2, 5)); }
  path(0.957); g.fillStyle = '#8b5a33'; g.fill();
  path(0.942);
  const gr = g.createRadialGradient(m - 14, m + 10, 0, m, m, R * CUT_S);
  gr.addColorStop(0, '#f0dc9c'); gr.addColorStop(0.55, '#ebd283'); gr.addColorStop(0.85, '#e2c472'); gr.addColorStop(1, '#f1e0ae');
  g.fillStyle = gr; g.fill();
  g.save(); path(0.942); g.clip();
  for (let i = 1; i <= 38; i++) {
    const f = Math.pow(i / 38, 0.92) * 0.935;
    g.save(); g.translate(-14 * (1 - f), 10 * (1 - f));
    path(f, 0.012, i); g.strokeStyle = `rgba(160,112,48,${rand(0.14, 0.34)})`; g.lineWidth = rand(1, 3.4); g.stroke();
    g.restore();
  }
  // 방사 갈라짐
  for (let i = 0; i < 3; i++) {
    const a = Math.random() * 7, r0 = rand(20, 60), r1 = rand(120, 260);
    g.strokeStyle = 'rgba(110,70,30,.55)'; g.lineWidth = rand(1.2, 2.4);
    g.beginPath(); g.moveTo(m - 14 + Math.cos(a) * r0, m + 10 + Math.sin(a) * r0);
    g.lineTo(m - 14 + Math.cos(a + rand(-0.05, 0.05)) * r1, m + 10 + Math.sin(a + rand(-0.05, 0.05)) * r1); g.stroke();
  }
  g.fillStyle = 'rgba(140,95,40,.6)'; g.beginPath(); g.arc(m - 14, m + 10, 5, 0, 7); g.fill();
  for (let i = 0; i < 30; i++) {
    const y0 = rand(-80, CUT_PX + 80), bend = rand(-60, 60);
    g.strokeStyle = Math.random() < 0.5 ? `rgba(255,250,230,${rand(0.12, 0.28)})` : `rgba(150,110,50,${rand(0.08, 0.18)})`;
    g.lineWidth = rand(2, 10);
    g.beginPath(); g.moveTo(-20, y0); g.quadraticCurveTo(m, y0 + bend, CUT_PX + 20, y0 + rand(-120, 120)); g.stroke();
  }
  for (let i = 0; i < 14000; i++) {
    g.fillStyle = Math.random() < 0.5 ? 'rgba(255,248,220,.12)' : 'rgba(150,110,50,.08)';
    g.fillRect(Math.random() * CUT_PX, Math.random() * CUT_PX, rand(1, 3), rand(1, 3));
  }
  for (let k = 0; k < 8; k++) {
    const cx = rand(200, 820), cy = rand(200, 820);
    for (let i = 0; i < 110; i++) {
      g.fillStyle = `rgba(250,244,222,${rand(0.4, 0.9)})`;
      g.beginPath(); g.arc(cx + rand(-45, 45), cy + rand(-30, 30), rand(1, 3.2), 0, 7); g.fill();
    }
  }
  g.restore(); g.restore();
  return c;
}

// 잎 모양 (0 타원, 1 참나무형, 2 톱니)
function leafPath(g, L, type) {
  const N = 28, top = [];
  for (let i = 0; i <= N; i++) {
    const u = i / N, x = -L / 2 + u * L;
    let e = Math.sin(Math.PI * Math.pow(u, 0.8)) * L * 0.3;
    if (type === 1) e *= 0.62 + 0.45 * Math.abs(Math.sin(u * Math.PI * 4.5));
    if (type === 2) e *= 0.78 * (1 + (i % 2) * 0.07);
    top.push([x, e]);
  }
  g.beginPath(); g.moveTo(-L / 2, 0);
  for (const [x, e] of top) g.lineTo(x, -e);
  for (let i = top.length - 1; i >= 0; i--) g.lineTo(top[i][0], top[i][1]);
  g.closePath();
}
function drawLeaf(g, L, type, col, edge, spots = 18) {
  leafPath(g, L, type); g.fillStyle = col; g.fill();
  g.save(); g.clip();
  for (let i = 0; i < spots; i++) { g.fillStyle = `rgba(${rand(60, 120) | 0},${rand(40, 80) | 0},20,${rand(0.05, 0.18)})`; g.beginPath(); g.arc(rand(-L / 2, L / 2), rand(-L / 4, L / 4), rand(1, L / 10), 0, 7); g.fill(); }
  g.lineWidth = Math.max(2, L * 0.08); g.strokeStyle = edge; leafPath(g, L, type); g.stroke();
  g.restore();
  g.strokeStyle = 'rgba(70,45,22,.5)'; g.lineWidth = Math.max(1, L * 0.018);
  g.beginPath(); g.moveTo(-L / 2 - L * 0.08, 0); g.lineTo(L / 2 * 0.95, 0); g.stroke();
  g.lineWidth = Math.max(0.6, L * 0.008);
  for (let k = 1; k < 7; k++) { const x = -L / 2 + k * L / 7.5; g.beginPath(); g.moveTo(x, 0); g.lineTo(x + L / 8, -L * 0.16); g.moveTo(x, 0); g.lineTo(x + L / 8, L * 0.16); g.stroke(); }
}
const LEAF_COLS = ['#a37a4e', '#8c6440', '#c49b68', '#6f4f33', '#b5895a', '#d2b088', '#7d5a3a', '#9b7550', '#c8a47a'];

function groundCanvas() {
  const S = MOBILE ? 1024 : 2048, k = S / 2048, c = mkCanvas(S, S), g = c.getContext('2d', CTX);
  g.fillStyle = '#4c3a28'; g.fillRect(0, 0, S, S);
  for (let i = 0; i < 20000 * k; i++) { const v = rand(40, 100) | 0; g.fillStyle = `rgba(${v},${v * 0.78 | 0},${v * 0.55 | 0},.35)`; g.fillRect(Math.random() * S, Math.random() * S, 3, 3); }
  for (let i = 0; i < 1900 * k; i++) {
    const x = Math.random() * S, y = Math.random() * S, L = rand(60, 150) * k, a = Math.random() * 7;
    for (const ox of [-S, 0, S]) for (const oy of [-S, 0, S]) {
      if (x + ox < -L || x + ox > S + L || y + oy < -L || y + oy > S + L) continue;
      g.save(); g.translate(x + ox, y + oy); g.rotate(a);
      g.fillStyle = 'rgba(0,0,0,.3)'; g.save(); g.translate(3, 3); leafPath(g, L, i % 3); g.fill(); g.restore();
      drawLeaf(g, L, i % 3, pick(LEAF_COLS), 'rgba(80,52,28,.5)', 8);
      g.restore();
    }
  }
  for (let i = 0; i < 50 * k; i++) {
    const x = Math.random() * S, y = Math.random() * S, a = Math.random() * 7, L = rand(120, 420) * k;
    g.strokeStyle = `rgba(${rand(60, 110) | 0},${rand(50, 90) | 0},${rand(40, 70) | 0},.95)`; g.lineWidth = rand(3, 7) * k;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * L, y + Math.sin(a) * L); g.stroke();
  }
  return c;
}

function leafAtlas() {
  const c = mkCanvas(1024, 256), g = c.getContext('2d', CTX);
  for (let i = 0; i < 4; i++) {
    g.save(); g.translate(i * 256 + 128, 128); g.rotate(0.0);
    const gr = g.createLinearGradient(-110, 0, 110, 0); gr.addColorStop(0, '#e2cfb0'); gr.addColorStop(1, '#f4e8d2');
    drawLeaf(g, 236, i % 3, gr, 'rgba(110,70,35,.55)');
    g.restore();
  }
  return c;
}

function drawTree(g, x, y, H, depth, o) {
  const br = (x, y, len, ang, th, d) => {
    const x2 = x + Math.sin(ang) * len, y2 = y - Math.cos(ang) * len;
    g.strokeStyle = o.bark; g.lineWidth = th; g.beginPath(); g.moveTo(x, y); g.lineTo(x2, y2); g.stroke();
    if (d <= 0) {
      if (Math.random() < o.fol) for (let k = 0; k < o.dots; k++) { g.fillStyle = pick(o.cols); g.beginPath(); g.arc(x2 + rand(-2, 2) * o.ds, y2 + rand(-2, 2) * o.ds, rand(0.5, 1) * o.ds, 0, 7); g.fill(); }
      return;
    }
    const n = Math.random() < 0.35 ? 3 : 2;
    for (let k = 0; k < n; k++) br(x2, y2, len * rand(0.66, 0.82), ang * 0.85 + (k - (n - 1) / 2) * rand(0.35, 0.6) + rand(-0.15, 0.15), th * 0.7, d - 1);
  };
  g.lineCap = 'round';
  br(x, y, H * 0.34, rand(-0.03, 0.03), H * o.thick, depth);
}

// ---------- 땅 ----------

function buildNail(n) {
  const g = new THREE.Group();

  shaft.scale.y = n.len * SC + 1.5;
  head.castShadow = shaft.castShadow = true;
  g.add(head, shaft); scene.add(g);
  const hole = new THREE.Mesh(holeGeo, decalMat); hole.scale.set(0.7, 1, 0.7); hole.position.set(X3(n.x), TOP_Y + 0.02, 0); scene.add(hole);

}
function bendNail(n) {
  const g = n.mesh; g.clear();
  const e = n.exposed * SC, k1 = e * 0.4, len2 = e * 0.75, a = 1.0, s = n.dir;
  const low = new THREE.Mesh(shaftUp, steelMat); low.scale.y = k1;

  const joint = new THREE.Mesh(jointGeo, steelMat); joint.position.y = k1;

  head.position.set(s * Math.sin(a) * len2, k1 + Math.cos(a) * len2, 0); head.rotation.z = -s * a;
  [low, up, joint, head].forEach(m => { m.castShadow = true; g.add(m); });
}

let AC = null, noiseBuf = null;
function initAudio() {
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.5, AC.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { AC = null; }
}
function tone(f, dur, type, vol, f2, delay = 0) {
  if (!AC) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, freq) {
  if (!AC) return;
  const t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f).connect(g).connect(AC.destination); s.start(t); s.stop(t + dur);
}
const sfx = {

  done() { tone(200, 0.25, 'sine', 0.5, 90); noise(0.12, 0.5, 700); },
  bend() { tone(1100, 0.45, 'sawtooth', 0.09, 260); tone(700, 0.3, 'square', 0.05, 200); noise(0.1, 0.3, 1500); },
  wood(s) { noise(0.14, 0.4 + s * 0.4, 450); tone(130, 0.16, 'sine', 0.4, 55); },

function headTop(n) {

  if (n.bent) return woodTop - n.exposed * 0.45 - 3;
  return woodTop - n.exposed - NH_H;
}
function floorAt(x) {

  for (const n of nails) if (Math.abs(x - n.x) < REACH) { const t = headTop(n); if (t < y) { y = t; nail = n; } }

}

function newRound() {

    const x = rand(40, W - 40);
    if (nails.some(n => Math.abs(n.x - x) < 90) || decor.some(n => Math.abs(n.x - x) < 26)) continue;
    const len = rand(55, 100);
    const n = { x, len, exposed: len, hits: 0, done: false, bent: false, dir: 1, wob: 0, rise: 0 };
    buildNail(n); nails.push(n);
  }
  nails.sort((a, b) => a.x - b.x);
  const f = floorAt(ham.x);
  if (ham.y > f.y - 1) { ham.y = f.y - 1; if (drag) drag.dy = ham.y - lastP.y; target.y = ham.y; }
  ham.armed = true; ham.hitY = 1e9;
}

function checkRound() { if (roundT <= 0 && nails.every(n => n.done || n.bent)) roundT = 1.2; }

// ---------- 충돌 & 타격 ----------
function pointerVy() {
  const now = performance.now();
  if (samples.length < 2) return 0;
  const last = samples[samples.length - 1];
  if (last.rt <= prevFrame && now - last.rt > 100) return 0;
  let old = last;
  for (let i = samples.length - 1; i >= 0; i--) { old = samples[i]; if (last.t - old.t >= 45) break; }
  const dt = (last.t - old.t) / 1000;
  return dt > 0 ? (last.y - old.y) / dt : 0;
}

function tryX(nx) {
  for (const n of nails) {
    if (Math.abs(nx - n.x) >= REACH) continue;
    const t = headTop(n);
    if (ham.y > t + 0.5) { if (ham.y - t <= 10) ham.y = t; else return; }
  }
  ham.x = nx;
}

function moveHammer() {
  if (ham.y < Math.min(floorAt(ham.x).y, ham.hitY) - 12) ham.armed = true;
  if (!drag) return;
  const tx = clamp(target.x, FACE_W / 2 + 2, W - FACE_W / 2 - 2), ty = clamp(target.y, woodTop - MAX_LIFT, woodTop + 200);
  const dx = tx - ham.x, dy = ty - ham.y;
  const steps = Math.min(300, Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) / 4)));
  const sx = dx / steps, sy = dy / steps;
  for (let i = 0; i < steps; i++) {
    tryX(ham.x + sx);
    let ny = ham.y + sy;
    if (sy > 0) {
      const f = floorAt(ham.x);
      if (ny >= f.y) { if (ham.armed) contact(f.nail); ny = f.y; }
    }
    ham.y = ny;
  }
}

function contact(n) {
  if (!ham.armed) return;
  ham.armed = false; ham.hitY = ham.y;
  const v = Math.min(pointerVy(), V_MAX); lastV = v;
  if (n) impact(n, v); else woodHit(v);
}

function woodHit(v) {
  if (v < 500) { if (v > V_MIN) sfx.wood(0.1); return; }
  const s = Math.min(1, v / 3000);
  sfx.wood(s); shake = Math.max(shake, 2 + s * 5);
  const m = new THREE.Mesh(holeGeo, decalMat);
  m.scale.set((8 + s * 9) * SC * 1.4, 1, 0.9); m.position.set(X3(ham.x), TOP_Y + 0.015, 0);
  scene.add(m); dents.push(m);
  while (dents.length > 30) scene.remove(dents.shift());
  spawnChips(ham.x, 4 + s * 8);
}

function impact(n, v) {
  if (n.done || n.bent) { sfx.clank(); return; }
  if (v < V_MIN) { sfx.tap(); return; }
  n.hits++; n.wob = 1;
  const dxh = ham.x - n.x, r = Math.abs(dxh) / REACH;
  if (r > 0.72 && v > 700) {
    n.bent = true; n.dir = dxh < 0 ? 1 : -1;
    bendNail(n); sfx.bend(); shake = 8;
    checkRound(); return;
  }
  const d = Math.min(n.exposed, (v - V_MIN) * K * (1 - 0.55 * r * r));
  n.exposed -= d;
  const s = Math.min(1, v / 3000);
  sfx.hit(1 - n.exposed / n.len, s);
  shake = Math.max(shake, Math.min(10, 1.5 + d * 0.25));
  if (n.exposed <= 0.5) {
    n.exposed = 0; n.done = true;
    n.mesh.children[0].material = brightMat;
    sfx.done(); spawnChips(n.x, 10); shake = Math.max(shake, 6);
    checkRound();
  }
}

// ---------- 화면 / 카메라 ----------
let vw = 1, vh = 1;
const camTarget = new THREE.Vector3();
function resize() {
  vw = innerWidth; vh = innerHeight;
  const dpr = Math.min(devicePixelRatio || 1, MOBILE ? 1.5 : 2);
  renderer.setPixelRatio(dpr); renderer.setSize(vw, vh, false);
  composer.setPixelRatio(dpr); composer.setSize(vw, vh);
  const portrait = vh > vw;
  camera.aspect = vw / vh; camera.fov = portrait ? 62 : 46;
  const t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const d = Math.max(33 / (t * camera.aspect), 26 / t);
  const pitch = THREE.MathUtils.degToRad(portrait ? 17 : 13);
  camTarget.set(0, TOP_Y + 6, 0);
  camera.position.set(0, camTarget.y + Math.sin(pitch) * d, Math.cos(pitch) * d);
  camera.lookAt(camTarget); camera.updateProjectionMatrix(); camera.updateMatrixWorld();
}
const _v = new THREE.Vector3();
function toScreen(x, y) { _v.set(X3(x), Y3(y), 0).project(camera); return { x: (_v.x + 1) / 2 * vw, y: (1 - _v.y) / 2 * vh }; }

// ---------- 입력 ----------
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0), hitP = new THREE.Vector3();
function toWorld(e) {
  ndc.set(e.clientX / vw * 2 - 1, -(e.clientY / vh) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  if (!ray.ray.intersectPlane(plane, hitP)) return lastP;
  return { x: hitP.x / SC + W / 2, y: woodTop - (hitP.y - TOP_Y) / SC };
}
glc.addEventListener('pointerdown', e => {
  initAudio();
  if (drag) return;
  const p = toWorld(e); lastP = p;
  drag = { id: e.pointerId, dx: ham.x - p.x, dy: ham.y - p.y };
  target.x = ham.x; target.y = ham.y; samples.length = 0;
  try { glc.setPointerCapture(e.pointerId); } catch (_) {}
  glc.classList.add('drag');
});
glc.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const list = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
  const now = performance.now();
  for (const ce of (list.length ? list : [e])) {
    const p = toWorld(ce); lastP = p;
    samples.push({ t: ce.timeStamp > 0 && Math.abs(now - ce.timeStamp) < 1000 ? ce.timeStamp : now, rt: now, y: p.y + drag.dy });
  }
  while (samples.length > 2 && now - samples[0].rt > 400) samples.shift();
  target.x = lastP.x + drag.dx; target.y = lastP.y + drag.dy;
});
function endDrag(e) { if (drag && e.pointerId === drag.id) { drag = null; glc.classList.remove('drag'); } }
glc.addEventListener('pointerup', endDrag);
glc.addEventListener('pointercancel', endDrag);
addEventListener('resize', resize);

// ---------- 업데이트 ----------
const fd = new THREE.Object3D();
function update(dt, t) {
  if (roundT > 0) { roundT -= dt; if (roundT <= 0) newRound(); }
  moveHammer();

  const prox = clamp((floorAt(ham.x).y - ham.y) / 50, 0, 1);
  const tt = drag ? clamp(-pointerVy() * 0.00008, -0.4, 0.4) * prox : 0;
  ham.tilt += (tt - ham.tilt) * Math.min(1, dt * 18);
  hammer.position.set(X3(ham.x), Y3(ham.y), 0);
  hPitch.rotation.z = -ham.tilt;

  for (const n of nails) {
    n.wob = Math.max(0, n.wob - dt * 4);
    n.rise = Math.min(1, n.rise + dt * 3);
    const ease = 1 - Math.pow(1 - n.rise, 3);
    n.mesh.position.x = X3(n.x) + Math.sin(t * 70) * n.wob * 0.22;
    n.mesh.position.y = TOP_Y + (n.bent ? 0 : n.done ? 0.3 - NH_H * SC : n.exposed * SC * ease - (1 - ease) * NH_H * SC);
  }
  for (const n of decor) n.mesh.position.y = TOP_Y + 0.3 - NH_H * SC;
  shake = Math.max(0, shake - dt * 40);
  clouds.rotation.y += dt * 0.004;

  for (let i = 0; i < FALL; i++) {
    const f = fall[i];
    f.y -= f.vy * dt; f.x += Math.sin(t * 1.2 + f.ph) * f.sw * dt; f.rx += f.wr * dt; f.ry += f.wr * 0.7 * dt;
    if (f.y < 0.3 || (Math.hypot(f.x, f.z) < R * 1.1 && f.y < TOP_Y + 0.5)) resetFall(f, false);
    fd.position.set(f.x, f.y, f.z); fd.rotation.set(Math.sin(f.rx) * 0.9, f.ry, Math.cos(f.rx * 0.8) * 0.6); fd.scale.setScalar(f.s);
    fd.updateMatrix(); fallMesh.setMatrixAt(i, fd.matrix);
  }
  fallMesh.instanceMatrix.needsUpdate = true;

  for (const c of chipPool) {
    if (c.life <= 0) continue;
    c.life -= dt; if (c.life <= 0) { c.m.visible = false; continue; }
    c.v.y -= 90 * dt; c.m.position.addScaledVector(c.v, dt);
    c.m.rotation.x += c.r.x * dt; c.m.rotation.y += c.r.y * dt; c.m.rotation.z += c.r.z * dt;
    const p = c.m.position, onTop = Math.hypot(p.x, p.z) < R * 0.95, floor = onTop ? TOP_Y + 0.1 : 0.1;
    if (p.y < floor && (onTop || p.y < TOP_Y - 1)) { p.y = floor; c.v.y *= -0.3; c.v.x *= 0.6; c.v.z *= 0.6; c.r.multiplyScalar(0.5); }
  }
}

let last = performance.now(), prevFrame = last;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt, now / 1000);
  const base = camera.position.clone();
  if (shake > 0) { camera.position.x += (Math.random() - 0.5) * shake * 0.1; camera.position.y += (Math.random() - 0.5) * shake * 0.1; }
  composer.render(dt);
  prevFrame = performance.now();
  camera.position.copy(base); camera.updateMatrixWorld();
  requestAnimationFrame(frame);
}
resize();
newRound();
requestAnimationFrame(frame);
window.__nail = { get nails() { return nails.map(({ mesh, hole, ...r }) => r); }, get ham() { return ham; }, get lastV() { return lastV; }, toScreen, woodTop };
</script>
</body>
