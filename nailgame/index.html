<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<style>

  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}

<body>
<canvas id="gl"></canvas>
<script type="module">
import * as THREE from 'three';

const glc = document.getElementById('gl');

// ---------- 상수 (게임 로직 단위: 1 = 3D 0.1) ----------
const FACE_W = 50, NH_W = 22, NH_H = 7, SC = 0.1, MAX_LIFT = 280;
const REACH = FACE_W / 2 + NH_W / 2, V_MIN = 200, V_MAX = 4000, K = 0.014;
const W = 420, woodTop = 372;
const R = 26, TOP_Y = 38;                         // 그루터기 반지름 / 윗면 높이
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);
const X3 = x => (x - W / 2) * SC, Y3 = y => TOP_Y + (woodTop - y) * SC;
const rf = th => 1 + 0.035 * Math.sin(3 * th + 1) + 0.02 * Math.sin(5 * th + 2) + 0.01 * Math.sin(11 * th + 0.5);

// ---------- 렌더러 ----------
const renderer = new THREE.WebGLRenderer({ canvas: glc, antialias: true });
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
const scene = new THREE.Scene();
const HAZE = new THREE.Color(0x8fb0dc);
scene.fog = new THREE.Fog(HAZE, 160, 900);
const camera = new THREE.PerspectiveCamera(48, 1, 0.5, 2500);
const ANISO = renderer.capabilities.getMaxAnisotropy();

function tex(cv, rx = 1, ry = 1, srgb = true) {
  const t = new THREE.CanvasTexture(cv);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = ANISO; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry);
  return t;
}
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

// ---------- 하늘 (그라디언트 + 해) ----------
const SUN_DIR = new THREE.Vector3(-0.27, 0.15, -0.95).normalize();
const skyMat = new THREE.ShaderMaterial({
  uniforms: { sunDir: { value: SUN_DIR } }, side: THREE.BackSide, depthWrite: false,
  vertexShader: `varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform vec3 sunDir; varying vec3 vDir;
    void main(){
      vec3 d = normalize(vDir); float h = clamp(d.y, 0.0, 1.0);
      vec3 zen = vec3(0.02, 0.11, 0.52), hor = vec3(0.26, 0.47, 0.82);
      vec3 col = mix(hor, zen, pow(h, 0.5));
      if (d.y < 0.0) col = mix(hor, vec3(0.3, 0.33, 0.33), clamp(-d.y * 4.0, 0.0, 1.0));
      float s = max(dot(d, sunDir), 0.0);
      col += vec3(1.0, 0.86, 0.62) * (pow(s, 12.0) * 0.22 + pow(s, 220.0) * 1.4);
      col += vec3(1.0, 0.97, 0.9) * smoothstep(0.99955, 0.99972, s) * 24.0;
      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`
});
const skyGeo = new THREE.SphereGeometry(1000, 48, 24);
scene.add(new THREE.Mesh(skyGeo, skyMat));
{ // 금속 반사용 환경맵: 하늘 그대로
  const s = new THREE.Scene(); s.add(new THREE.Mesh(skyGeo, skyMat));
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(s, 0.02, 0.1, 3000).texture; pm.dispose();
}

// 구름
const clouds = new THREE.Group(); scene.add(clouds);
{
  const texs = [];
  for (let k = 0; k < 4; k++) {
    const c = mkCanvas(512, 256), g = c.getContext('2d');
    for (let i = 0; i < 46; i++) {
      const x = rand(90, 420), arch = Math.sin(clamp((x - 90) / 330, 0, 1) * Math.PI);
      const y = 175 - arch * rand(20, 75), r = rand(28, 72) * (0.6 + arch * 0.5);
      const gr = g.createRadialGradient(x, y, 0, x, y, r);
      gr.addColorStop(0, 'rgba(255,255,255,.5)'); gr.addColorStop(0.6, 'rgba(255,255,255,.25)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
    }
    g.globalCompositeOperation = 'source-atop';
    const sh = g.createLinearGradient(0, 90, 0, 230);
    sh.addColorStop(0, 'rgba(255,255,255,0)'); sh.addColorStop(1, 'rgba(140,155,180,.55)');
    g.fillStyle = sh; g.fillRect(0, 0, 512, 256);
    texs.push(tex(c));
  }
  for (let i = 0; i < 14; i++) {
    const a = rand(-1.5, 1.5), e = rand(0.05, 0.38), D = 750;
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: texs[i % 4], transparent: true, depthWrite: false, fog: false, color: new THREE.Color(1.25, 1.25, 1.25), opacity: rand(0.6, 0.9) }));
    sp.position.set(Math.sin(a) * Math.cos(e) * D, Math.sin(e) * D, -Math.cos(a) * Math.cos(e) * D);
    const w = rand(160, 340); sp.scale.set(w, w / 2, 1);
    clouds.add(sp);
  }
}

// ---------- 조명 ----------
scene.add(new THREE.HemisphereLight(0xbcd6ff, 0x5a4630, 1.15));
const sun = new THREE.DirectionalLight(0xfff1dc, 3.0);
const LIGHT_DIR = new THREE.Vector3(-0.62, 0.74, -0.06).normalize();
sun.position.copy(LIGHT_DIR).multiplyScalar(140).add(new THREE.Vector3(0, TOP_Y, 0));
sun.target.position.set(0, TOP_Y * 0.6, 0); scene.add(sun.target);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -55, right: 55, top: 55, bottom: -55, near: 20, far: 300 });
sun.shadow.bias = -0.0003; sun.shadow.normalBias = 0.04;
scene.add(sun);

// ---------- 텍스처 ----------
function barkCanvas(w, h, lichen) {
  const c = mkCanvas(w, h), g = c.getContext('2d');
  g.fillStyle = '#5e5249'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 9000; i++) {
    const v = rand(60, 150) | 0; g.fillStyle = `rgba(${v},${v * 0.9 | 0},${v * 0.8 | 0},.2)`;
    g.fillRect(Math.random() * w, Math.random() * h, rand(1, 4), rand(2, 9));
  }
  const wavy = (x0, lw, col, amp, fr) => {
    g.strokeStyle = col; g.lineWidth = lw;
    for (const off of [-w, 0, w]) {
      g.beginPath(); const ph = Math.random() * 6;
      for (let y = -10; y <= h + 10; y += 6) { const x = x0 + off + Math.sin(y * fr + ph) * amp + Math.sin(y * fr * 3.1) * amp * 0.3; y < 0 ? g.moveTo(x, y) : g.lineTo(x, y); }
      g.stroke();
    }
  };
  for (let i = 0; i < 80; i++) wavy(Math.random() * w, rand(2, 7), `rgba(28,22,18,${rand(0.3, 0.55)})`, rand(3, 10), rand(0.01, 0.03));
  for (let i = 0; i < 60; i++) wavy(Math.random() * w, rand(1, 3), `rgba(165,155,145,${rand(0.2, 0.4)})`, rand(3, 9), rand(0.01, 0.03));
  for (let i = 0; i < 40; i++) {
    g.strokeStyle = 'rgba(15,10,8,.55)'; g.lineWidth = rand(1, 3);
    const x = Math.random() * w, y = Math.random() * h; g.beginPath(); g.moveTo(x, y); g.lineTo(x + rand(6, 20), y + rand(-3, 3)); g.stroke();
  }
  for (let i = 0; i < lichen; i++) {
    const cx = Math.random() * w, cy = Math.random() * h;
    for (let j = 0; j < 40; j++) {
      g.fillStyle = `rgba(${rand(170, 200) | 0},${rand(175, 200) | 0},${rand(150, 170) | 0},${rand(0.3, 0.7)})`;
      g.beginPath(); g.arc(cx + rand(-18, 18), cy + rand(-12, 12), rand(1, 4), 0, 7); g.fill();
    }
  }
  return c;
}

const CUT_PX = 1024, CUT_S = (CUT_PX / 2) / (R * 1.07);
function cutCanvas() {
  const c = mkCanvas(CUT_PX, CUT_PX), g = c.getContext('2d'), m = CUT_PX / 2;
  const path = (f, wob = 0, ph = 0) => {
    g.beginPath();
    for (let i = 0; i <= 160; i++) {
      const th = i / 160 * Math.PI * 2, r = R * rf(th) * f * (1 + wob * Math.sin(th * 6 + ph)) * CUT_S;
      const x = m + Math.sin(th) * r, y = m + Math.cos(th) * r;
      i ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.closePath();
  };
  g.fillStyle = '#3a3029'; g.fillRect(0, 0, CUT_PX, CUT_PX);
  path(1); g.save(); g.clip();
  // 껍질 링
  g.fillStyle = '#3d332b'; g.fillRect(0, 0, CUT_PX, CUT_PX);
  for (let i = 0; i < 2500; i++) { const v = rand(30, 90) | 0; g.fillStyle = `rgba(${v},${v * 0.85 | 0},${v * 0.7 | 0},.5)`; g.fillRect(Math.random() * CUT_PX, Math.random() * CUT_PX, 3, 3); }
  // 형성층(적갈색)
  path(0.955); g.fillStyle = '#8b5a33'; g.fill();
  // 목질부
  path(0.94);
  const gr = g.createRadialGradient(m - 14, m + 10, 0, m, m, R * CUT_S);
  gr.addColorStop(0, '#f0dc9c'); gr.addColorStop(0.55, '#ebd283'); gr.addColorStop(0.85, '#e2c472'); gr.addColorStop(1, '#f1e0ae');
  g.fillStyle = gr; g.fill();
  g.save(); path(0.94); g.clip();
  // 나이테
  for (let i = 1; i <= 34; i++) {
    const f = Math.pow(i / 34, 0.92) * 0.93;
    g.save(); g.translate(-14 * (1 - f), 10 * (1 - f));
    path(f, 0.012, i); g.strokeStyle = `rgba(160,115,50,${rand(0.14, 0.32)})`; g.lineWidth = rand(1, 3.2); g.stroke();
    g.restore();
  }
  // 수(심)
  g.fillStyle = 'rgba(140,95,40,.6)'; g.beginPath(); g.arc(m - 14, m + 10, 5, 0, 7); g.fill();
  // 톱자국
  for (let i = 0; i < 26; i++) {
    const y0 = rand(-80, CUT_PX + 80), bend = rand(-60, 60);
    g.strokeStyle = Math.random() < 0.5 ? `rgba(255,250,230,${rand(0.12, 0.28)})` : `rgba(150,110,50,${rand(0.08, 0.18)})`;
    g.lineWidth = rand(2, 10);
    g.beginPath(); g.moveTo(-20, y0); g.quadraticCurveTo(m, y0 + bend, CUT_PX + 20, y0 + rand(-120, 120)); g.stroke();
  }
  // 결 노이즈
  for (let i = 0; i < 9000; i++) {
    g.fillStyle = Math.random() < 0.5 ? 'rgba(255,248,220,.12)' : 'rgba(150,110,50,.08)';
    g.fillRect(Math.random() * CUT_PX, Math.random() * CUT_PX, rand(1, 3), rand(1, 3));
  }
  // 톱밥
  for (let k = 0; k < 7; k++) {
    const cx = rand(200, 820), cy = rand(200, 820);
    for (let i = 0; i < 90; i++) {
      g.fillStyle = `rgba(250,244,222,${rand(0.4, 0.9)})`;
      g.beginPath(); g.arc(cx + rand(-45, 45), cy + rand(-30, 30), rand(1, 3.2), 0, 7); g.fill();
    }
  }
  g.restore(); g.restore();
  return c;
}

function leafCanvas() {
  const S = 2048, c = mkCanvas(S, S), g = c.getContext('2d');
  g.fillStyle = '#5b4630'; g.fillRect(0, 0, S, S);
  for (let i = 0; i < 20000; i++) { const v = rand(50, 110) | 0; g.fillStyle = `rgba(${v},${v * 0.78 | 0},${v * 0.55 | 0},.35)`; g.fillRect(Math.random() * S, Math.random() * S, 3, 3); }
  const cols = ['#a37a4e', '#8c6440', '#c49b68', '#6f4f33', '#b5895a', '#d2b088', '#7d5a3a', '#9b7550', '#c8a47a'];
  const leaf = (x, y, L, a, col) => {
    for (const ox of [-S, 0, S]) for (const oy of [-S, 0, S]) {
      if (x + ox < -L || x + ox > S + L || y + oy < -L || y + oy > S + L) continue;
      g.save(); g.translate(x + ox, y + oy); g.rotate(a);
      g.fillStyle = 'rgba(0,0,0,.25)'; g.beginPath(); g.moveTo(-L / 2 + 2, 3); g.quadraticCurveTo(2, -L * 0.36 + 3, L / 2 + 2, 3); g.quadraticCurveTo(2, L * 0.36 + 3, -L / 2 + 2, 3); g.fill();
      g.fillStyle = col; g.beginPath(); g.moveTo(-L / 2, 0); g.quadraticCurveTo(0, -L * 0.36, L / 2, 0); g.quadraticCurveTo(0, L * 0.36, -L / 2, 0); g.fill();
      g.strokeStyle = 'rgba(60,40,25,.45)'; g.lineWidth = 1.2;
      g.beginPath(); g.moveTo(-L / 2 - 5, 0); g.lineTo(L / 2, 0); g.stroke();
      g.lineWidth = 0.7;
      for (let k = -2; k <= 2; k++) { if (!k) continue; g.beginPath(); g.moveTo(k * L / 7, 0); g.lineTo(k * L / 7 + L / 9, -L * 0.15); g.moveTo(k * L / 7, 0); g.lineTo(k * L / 7 + L / 9, L * 0.15); g.stroke(); }
      g.restore();
    }
  };
  for (let i = 0; i < 1500; i++) leaf(Math.random() * S, Math.random() * S, rand(60, 150), Math.random() * 7, cols[Math.random() * cols.length | 0]);
  for (let i = 0; i < 40; i++) {
    const x = Math.random() * S, y = Math.random() * S, a = Math.random() * 7, L = rand(120, 420);
    g.strokeStyle = `rgba(${rand(60, 110) | 0},${rand(50, 90) | 0},${rand(40, 70) | 0},.9)`; g.lineWidth = rand(3, 7);
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * L, y + Math.sin(a) * L); g.stroke();
  }
  for (let i = 0; i < 26; i++) {
    const x = Math.random() * S, y = Math.random() * S;
    for (let j = 0; j < 4; j++) { g.fillStyle = `rgba(${rand(70, 110) | 0},${rand(130, 170) | 0},${rand(50, 80) | 0},.9)`; g.beginPath(); g.ellipse(x + rand(-6, 6), y + rand(-6, 6), rand(3, 7), rand(2, 4), Math.random() * 3, 0, 7); g.fill(); }
  }
  return c;
}

function treelineCanvas() {
  const w = 2048, h = 256, c = mkCanvas(w, h), g = c.getContext('2d');
  for (let layer = 0; layer < 3; layer++) {
    const haze = 1 - layer * 0.18;
    for (let i = 0; i < 160; i++) {
      const x = Math.random() * w, top = rand(30, 150) + layer * 25;
      const k = rand(0.8, 1.1) * haze, pal = [[104, 84, 62], [92, 88, 60], [118, 96, 70], [80, 78, 66], [70, 84, 56]][Math.random() * 5 | 0];
      g.fillStyle = `rgb(${pal[0] * k | 0},${pal[1] * k | 0},${pal[2] * k | 0})`;
      for (const ox of [-w, 0, w]) {
        g.fillRect(x + ox - 2, top, 4, h);
        for (let j = 0; j < 10; j++) { g.beginPath(); g.ellipse(x + ox + rand(-24, 24), top + rand(0, 50), rand(6, 16), rand(6, 14), 0, 0, 7); g.fill(); }
      }
    }
    g.fillRect(0, h - 40 + layer * 10, w, 60);
  }
  return c;
}

// ---------- 땅 ----------
{
  const lc = leafCanvas();
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(2400, 2400),
    new THREE.MeshStandardMaterial({ map: tex(lc, 12, 12), bumpMap: tex(lc, 12, 12, false), bumpScale: 0.8, roughness: 0.95 }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
  const ring = new THREE.Mesh(new THREE.CylinderGeometry(560, 560, 90, 64, 1, true),
    new THREE.MeshBasicMaterial({ map: tex(treelineCanvas(), 3, 1), transparent: true, alphaTest: 0.05, side: THREE.BackSide }));
  ring.material.map.wrapT = THREE.ClampToEdgeWrapping;
  ring.position.y = 43; scene.add(ring);
}

// ---------- 그루터기 ----------
const barkTex = tex(barkCanvas(1024, 512, 6), 2, 1);
const barkBump = tex(barkTex.image, 2, 1, false);
const barkMat = new THREE.MeshStandardMaterial({ map: barkTex, bumpMap: barkBump, bumpScale: 1.4, roughness: 0.95 });
{
  const H = TOP_Y + 2, geo = new THREE.CylinderGeometry(R, R, H, 96, 16, true);
  geo.translate(0, H / 2 - 2, 0);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i), th = Math.atan2(x, z);
    const flare = 1 + 0.24 * Math.pow(1 - clamp(y / (TOP_Y * 0.35), 0, 1), 2);
    const s = rf(th) * flare * (1 + 0.012 * Math.sin(th * 37 + y * 0.2));
    p.setX(i, Math.sin(th) * R * s); p.setZ(i, Math.cos(th) * R * s);
  }
  geo.computeVertexNormals();
  const side = new THREE.Mesh(geo, barkMat); side.castShadow = side.receiveShadow = true; scene.add(side);

  const sh = new THREE.Shape();
  for (let i = 0; i < 160; i++) {
    const th = i / 160 * Math.PI * 2, r = R * rf(th);
    const x = Math.sin(th) * r, z = Math.cos(th) * r;
    i ? sh.lineTo(x, -z) : sh.moveTo(x, -z);
  }
  const cap = new THREE.ShapeGeometry(sh, 4); cap.rotateX(-Math.PI / 2);
  const cp = cap.attributes.position, uv = cap.attributes.uv;
  for (let i = 0; i < cp.count; i++) uv.setXY(i, 0.5 + cp.getX(i) / (2 * R * 1.07), 0.5 - cp.getZ(i) / (2 * R * 1.07));
  const cc = cutCanvas();
  const top = new THREE.Mesh(cap, new THREE.MeshStandardMaterial({ map: tex(cc), bumpMap: tex(cc, 1, 1, false), bumpScale: 0.25, roughness: 0.82 }));
  top.position.y = TOP_Y; top.receiveShadow = true; scene.add(top);
}

// 나뭇가지들, 주변 나무
{
  const twigMat = new THREE.MeshStandardMaterial({ map: barkTex, color: 0x9a8f86, roughness: 0.95 });
  const lichenMat = new THREE.MeshStandardMaterial({ map: tex(barkCanvas(512, 256, 14), 3, 1), color: 0xb0aaa0, roughness: 0.95 });
  const branch = (r, L, x, z, ay, mat, lift = 0, tilt = 0) => {
    const m = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.75, r, L, 10), mat);
    m.rotation.order = 'YXZ'; m.rotation.set(0, ay, Math.PI / 2 - tilt);
    m.position.set(x, r + lift, z); m.castShadow = m.receiveShadow = true; scene.add(m); return m;
  };
  branch(2.2, 90, 44, 6, -0.9, lichenMat, 0, 0.04);
  branch(1.4, 55, 30, -34, 0.5, twigMat);
  for (let i = 0; i < 14; i++) {
    const a = Math.random() * 7, d = rand(R + 8, 110);
    branch(rand(0.25, 0.7), rand(12, 40), Math.cos(a) * d, Math.sin(a) * d, Math.random() * 7, twigMat);
  }
  const trunkMat = new THREE.MeshStandardMaterial({ map: tex(barkTex.image, 1, 5), bumpMap: tex(barkTex.image, 1, 5, false), bumpScale: 1, roughness: 0.95 });
  const sunAz = Math.atan2(SUN_DIR.x, -SUN_DIR.z);
  let made = 0;
  while (made < 7) {
    const az = (Math.random() < 0.5 ? -1 : 1) * rand(0.55, 1.5), d = rand(220, 460);
    if (Math.abs(az - sunAz) < 0.25) continue;
    const r = rand(2.5, 4.5), Hh = rand(260, 340);
    const t = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.55, r, Hh, 12), trunkMat);
    t.position.set(Math.sin(az) * d, Hh / 2, -Math.cos(az) * d); t.castShadow = true; scene.add(t);
    for (let j = 0; j < 4; j++) {
      const L = rand(30, 70), b = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.15, r * 0.35, L, 8), trunkMat);
      const h = rand(90, Hh * 0.8), ang = Math.random() * 7, up = rand(0.5, 1.1);
      b.position.set(t.position.x + Math.cos(ang) * Math.sin(up) * L / 2, h + Math.cos(up) * L / 2, t.position.z + Math.sin(ang) * Math.sin(up) * L / 2);
      b.lookAt(t.position.x + Math.cos(ang) * Math.sin(up) * L, h + Math.cos(up) * L, t.position.z + Math.sin(ang) * Math.sin(up) * L);
      b.rotateX(Math.PI / 2); scene.add(b);
    }
    made++;
  }
}

// ---------- 못 ----------
const steelMat = new THREE.MeshStandardMaterial({ color: 0xd2d7dc, metalness: 0.95, roughness: 0.3 });
const brightMat = new THREE.MeshStandardMaterial({ color: 0xe8ecf0, metalness: 1, roughness: 0.16 });
const headGeo = new THREE.CylinderGeometry(NH_W / 2 * SC, NH_W / 2 * SC * 0.9, NH_H * SC, 28); headGeo.translate(0, NH_H * SC / 2, 0);
const shaftDown = new THREE.CylinderGeometry(0.3, 0.3, 1, 12); shaftDown.translate(0, -0.5, 0);
const shaftUp = new THREE.CylinderGeometry(0.3, 0.3, 1, 12); shaftUp.translate(0, 0.5, 0);
const jointGeo = new THREE.SphereGeometry(0.3, 12, 8);
const holeGeo = new THREE.CircleGeometry(1, 24); holeGeo.rotateX(-Math.PI / 2);
const decalMat = new THREE.MeshBasicMaterial({ color: 0x2a1a0a, transparent: true, opacity: 0.4, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2 });

function buildNail(n) {
  const g = new THREE.Group();
  const head = new THREE.Mesh(headGeo, steelMat), shaft = new THREE.Mesh(shaftDown, steelMat);
  shaft.scale.y = n.len * SC + 1.5;
  head.castShadow = shaft.castShadow = true;
  g.add(head, shaft); scene.add(g);
  const hole = new THREE.Mesh(holeGeo, decalMat); hole.scale.set(0.7, 1, 0.7); hole.position.set(X3(n.x), TOP_Y + 0.02, 0); scene.add(hole);
  g.position.x = X3(n.x);
  n.mesh = g; n.hole = hole;
}
function bendNail(n) {
  const g = n.mesh; g.clear();
  const e = n.exposed * SC, k1 = e * 0.4, len2 = e * 0.75, a = 1.0, s = n.dir;
  const low = new THREE.Mesh(shaftUp, steelMat); low.scale.y = k1;
  const up = new THREE.Mesh(shaftUp, steelMat); up.scale.y = len2; up.position.y = k1; up.rotation.z = -s * a;
  const joint = new THREE.Mesh(jointGeo, steelMat); joint.position.y = k1;
  const head = new THREE.Mesh(headGeo, steelMat);
  head.position.set(s * Math.sin(a) * len2, k1 + Math.cos(a) * len2, 0); head.rotation.z = -s * a;
  [low, up, joint, head].forEach(m => { m.castShadow = true; g.add(m); });
}
function removeNail(n) { scene.remove(n.mesh, n.hole); }

// ---------- 망치 ----------
const hammer = new THREE.Group(), hYaw = new THREE.Group(), hPitch = new THREE.Group();
hammer.add(hYaw); hYaw.add(hPitch); hYaw.rotation.y = -0.55; scene.add(hammer);
{
  const add = (geo, mat, x, y, z, rz = 0) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.rotation.z = rz; m.castShadow = true; hPitch.add(m); return m; };
  const headMat = new THREE.MeshStandardMaterial({ color: 0x6b6b6b, metalness: 0.6, roughness: 0.52 });
  add(new THREE.CylinderGeometry(2.5, 2.5, 1.5, 40), brightMat, 0, 0.75, 0);
  add(new THREE.CylinderGeometry(1.9, 2.3, 3.2, 40), headMat, 0, 3.1, 0);
  add(new THREE.BoxGeometry(4.2, 2.8, 3.2), headMat, 0, 6.0, 0);
  const sh = new THREE.Shape();
  sh.moveTo(-1.7, 0); sh.quadraticCurveTo(-2.3, 2.6, 1.4, 4.0); sh.quadraticCurveTo(-0.2, 1.8, 1.7, 0); sh.closePath();
  const claw = new THREE.ExtrudeGeometry(sh, { depth: 2.4, bevelEnabled: true, bevelSize: 0.2, bevelThickness: 0.2, bevelSegments: 2 });
  claw.translate(0, 7.2, -1.2);
  add(claw, headMat, 0, 0, 0);
  const woodMat = new THREE.MeshStandardMaterial({ color: 0xd2a06a, roughness: 0.5 });
  const handle = add(new THREE.CylinderGeometry(0.85, 1.05, 26, 20), woodMat, 14.6, 6.0, 0, Math.PI / 2); handle.scale.z = 0.8;
  const gripMat = new THREE.MeshStandardMaterial({ color: 0x1d1d1f, roughness: 0.85 });
  add(new THREE.CylinderGeometry(1.3, 1.22, 10, 24), gripMat, 23.6, 6.0, 0, Math.PI / 2);
  const cap = add(new THREE.SphereGeometry(1.3, 20, 12), gripMat, 28.6, 6.0, 0); cap.scale.x = 0.5;
  const rib = new THREE.TorusGeometry(1.31, 0.1, 6, 24); rib.rotateY(Math.PI / 2);
  for (let gx = 19.4; gx < 28.4; gx += 1.1) add(rib, gripMat, gx, 6.0, 0);
}

// ---------- 나무 부스러기 ----------
const chipGeo = new THREE.BoxGeometry(0.8, 0.18, 0.5);
const chipMats = [new THREE.MeshStandardMaterial({ color: 0xead7a2, roughness: 0.8 }), new THREE.MeshStandardMaterial({ color: 0xcdb27a, roughness: 0.8 })];
const chipPool = [];
for (let i = 0; i < 90; i++) { const m = new THREE.Mesh(chipGeo, chipMats[i % 2]); m.visible = false; m.castShadow = true; scene.add(m); chipPool.push({ m, life: 0 }); }
function spawnChips(x, n) {
  for (let i = 0; i < n; i++) {
    const c = chipPool.find(p => p.life <= 0); if (!c) return;
    const a = rand(0.3, Math.PI - 0.3), sp = rand(8, 24);
    c.life = rand(0.8, 1.4); c.m.visible = true;
    c.m.position.set(X3(x) + rand(-1.4, 1.4), TOP_Y + 0.3, rand(-1, 1));
    c.v = new THREE.Vector3(Math.cos(a) * sp, Math.sin(a) * sp, rand(-10, 10));
    c.r = new THREE.Vector3(rand(-14, 14), rand(-14, 14), rand(-14, 14));
  }
}

// ---------- 사운드 ----------
let AC = null, noiseBuf = null;
function initAudio() {
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.5, AC.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { AC = null; }
}
function tone(f, dur, type, vol, f2, delay = 0) {
  if (!AC) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, freq) {
  if (!AC) return;
  const t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f).connect(g).connect(AC.destination); s.start(t); s.stop(t + dur);
}
const sfx = {
  hit(p, s) { tone(1300 + p * 900, 0.22, 'triangle', 0.18 + s * 0.12); tone(2900 + p * 1400, 0.1, 'sine', 0.08); noise(0.07, 0.35 + s * 0.3, 2200); tone(160, 0.08, 'sine', 0.3, 80); },
  done() { tone(200, 0.25, 'sine', 0.5, 90); noise(0.12, 0.5, 700); },
  bend() { tone(1100, 0.45, 'sawtooth', 0.09, 260); tone(700, 0.3, 'square', 0.05, 200); noise(0.1, 0.3, 1500); },
  wood(s) { noise(0.14, 0.4 + s * 0.4, 450); tone(130, 0.16, 'sine', 0.4, 55); },
  tap() { tone(1800, 0.05, 'triangle', 0.05); },
  clank() { tone(620, 0.14, 'square', 0.06, 500); noise(0.05, 0.2, 2500); },
};

// ---------- 게임 상태 ----------
let nails = [], decor = [], dents = [], shake = 0, roundT = 0;
const ham = { x: W / 2, y: woodTop - 180, armed: true, tilt: 0, hitY: 1e9 };
const target = { x: ham.x, y: ham.y };
let drag = null, lastP = { x: 0, y: 0 }, lastV = 0;
const samples = [];

function headTop(n) {
  if (n.done) return woodTop - 3;
  if (n.bent) return woodTop - n.exposed * 0.45 - 3;
  return woodTop - n.exposed - NH_H;
}
function floorAt(x) {
  let y = woodTop, nail = null;
  for (const n of nails) if (Math.abs(x - n.x) < REACH) { const t = headTop(n); if (t < y) { y = t; nail = n; } }
  return { y, nail };
}

function newRound() {
  for (const n of nails) { if (n.bent) removeNail(n); else decor.push(n); }
  while (decor.length > 12) removeNail(decor.shift());
  nails = [];
  const count = 2 + (Math.random() * 3 | 0);
  for (let tries = 0; nails.length < count && tries < 200; tries++) {
    const x = rand(40, W - 40);
    if (nails.some(n => Math.abs(n.x - x) < 90) || decor.some(n => Math.abs(n.x - x) < 26)) continue;
    const len = rand(55, 100);
    const n = { x, len, exposed: len, hits: 0, done: false, bent: false, dir: 1, wob: 0, rise: 0 };
    buildNail(n); nails.push(n);
  }
  nails.sort((a, b) => a.x - b.x);
  // 새 못이 망치를 뚫지 않도록 망치를 위로
  const f = floorAt(ham.x);
  if (ham.y > f.y - 1) { ham.y = f.y - 1; if (drag) drag.dy = ham.y - lastP.y; target.y = ham.y; }
  ham.armed = true; ham.hitY = 1e9;
}

function checkRound() { if (roundT <= 0 && nails.every(n => n.done || n.bent)) roundT = 1.2; }

// ---------- 충돌 & 타격 ----------
function pointerVy() {
  const now = performance.now();
  if (samples.length < 2) return 0;
  const last = samples[samples.length - 1];
  if (last.rt <= prevFrame && now - last.rt > 100) return 0;
  let old = last;
  for (let i = samples.length - 1; i >= 0; i--) { old = samples[i]; if (last.t - old.t >= 45) break; }
  const dt = (last.t - old.t) / 1000;
  return dt > 0 ? (last.y - old.y) / dt : 0;
}

function tryX(nx) {
  for (const n of nails) {
    if (Math.abs(nx - n.x) >= REACH) continue;
    const t = headTop(n);
    if (ham.y > t + 0.5) { if (ham.y - t <= 10) ham.y = t; else return; }
  }
  ham.x = nx;
}

function moveHammer() {
  if (ham.y < Math.min(floorAt(ham.x).y, ham.hitY) - 12) ham.armed = true;
  if (!drag) return;
  const tx = clamp(target.x, FACE_W / 2 + 2, W - FACE_W / 2 - 2), ty = clamp(target.y, woodTop - MAX_LIFT, woodTop + 200);
  const dx = tx - ham.x, dy = ty - ham.y;
  const steps = Math.min(300, Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) / 4)));
  const sx = dx / steps, sy = dy / steps;
  for (let i = 0; i < steps; i++) {
    tryX(ham.x + sx);
    let ny = ham.y + sy;
    if (sy > 0) {
      const f = floorAt(ham.x);
      if (ny >= f.y) { if (ham.armed) contact(f.nail); ny = f.y; }
    }
    ham.y = ny;
  }
}

function contact(n) {
  if (!ham.armed) return;
  ham.armed = false; ham.hitY = ham.y;
  const v = Math.min(pointerVy(), V_MAX); lastV = v;
  if (n) impact(n, v); else woodHit(v);
}

function woodHit(v) {
  if (v < 500) { if (v > V_MIN) sfx.wood(0.1); return; }
  const s = Math.min(1, v / 3000);
  sfx.wood(s); shake = Math.max(shake, 2 + s * 5);
  const m = new THREE.Mesh(holeGeo, decalMat);
  m.scale.set((8 + s * 9) * SC * 1.4, 1, 0.9); m.position.set(X3(ham.x), TOP_Y + 0.015, 0);
  scene.add(m); dents.push(m);
  while (dents.length > 30) scene.remove(dents.shift());
  spawnChips(ham.x, 4 + s * 8);
}

function impact(n, v) {
  if (n.done || n.bent) { sfx.clank(); return; }
  if (v < V_MIN) { sfx.tap(); return; }
  n.hits++; n.wob = 1;
  const dxh = ham.x - n.x, r = Math.abs(dxh) / REACH;
  if (r > 0.72 && v > 700) {
    n.bent = true; n.dir = dxh < 0 ? 1 : -1;
    bendNail(n); sfx.bend(); shake = 8;
    checkRound(); return;
  }
  const d = Math.min(n.exposed, (v - V_MIN) * K * (1 - 0.55 * r * r));
  n.exposed -= d;
  const s = Math.min(1, v / 3000);
  sfx.hit(1 - n.exposed / n.len, s);
  shake = Math.max(shake, Math.min(10, 1.5 + d * 0.25));
  if (n.exposed <= 0.5) {
    n.exposed = 0; n.done = true;
    n.mesh.children[0].material = brightMat;
    sfx.done(); spawnChips(n.x, 10); shake = Math.max(shake, 6);
    checkRound();
  }
}

// ---------- 화면 / 카메라 ----------
let vw = 1, vh = 1;
const camTarget = new THREE.Vector3();
function resize() {
  vw = innerWidth; vh = innerHeight;
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2)); renderer.setSize(vw, vh, false);
  const portrait = vh > vw;
  camera.aspect = vw / vh; camera.fov = portrait ? 64 : 48;
  const t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const d = Math.max(33 / (t * camera.aspect), 26 / t);
  const pitch = THREE.MathUtils.degToRad(portrait ? 17 : 13);
  camTarget.set(0, TOP_Y + 6, 0);
  camera.position.set(0, camTarget.y + Math.sin(pitch) * d, Math.cos(pitch) * d);
  camera.lookAt(camTarget); camera.updateProjectionMatrix(); camera.updateMatrixWorld();
}
const _v = new THREE.Vector3();
function toScreen(x, y) { _v.set(X3(x), Y3(y), 0).project(camera); return { x: (_v.x + 1) / 2 * vw, y: (1 - _v.y) / 2 * vh }; }

// ---------- 입력 ----------
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0), hitP = new THREE.Vector3();
function toWorld(e) {
  ndc.set(e.clientX / vw * 2 - 1, -(e.clientY / vh) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  if (!ray.ray.intersectPlane(plane, hitP)) return lastP;
  return { x: X(hitP.x), y: woodTop - (hitP.y - TOP_Y) / SC };
}
const X = x3 => x3 / SC + W / 2;
glc.addEventListener('pointerdown', e => {
  initAudio();
  if (drag) return;
  const p = toWorld(e); lastP = p;
  drag = { id: e.pointerId, dx: ham.x - p.x, dy: ham.y - p.y };
  target.x = ham.x; target.y = ham.y; samples.length = 0;
  try { glc.setPointerCapture(e.pointerId); } catch (_) {}
  glc.classList.add('drag');
});
glc.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const list = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
  const now = performance.now();
  for (const ce of (list.length ? list : [e])) {
    const p = toWorld(ce); lastP = p;
    samples.push({ t: ce.timeStamp > 0 && Math.abs(now - ce.timeStamp) < 1000 ? ce.timeStamp : now, rt: now, y: p.y + drag.dy });
  }
  while (samples.length > 2 && now - samples[0].rt > 400) samples.shift();
  target.x = lastP.x + drag.dx; target.y = lastP.y + drag.dy;
});
function endDrag(e) { if (drag && e.pointerId === drag.id) { drag = null; glc.classList.remove('drag'); } }
glc.addEventListener('pointerup', endDrag);
glc.addEventListener('pointercancel', endDrag);
addEventListener('resize', resize);

// ---------- 업데이트 ----------
function update(dt, t) {
  if (roundT > 0) { roundT -= dt; if (roundT <= 0) newRound(); }
  moveHammer();

  const prox = clamp((floorAt(ham.x).y - ham.y) / 50, 0, 1);
  const tt = drag ? clamp(-pointerVy() * 0.00008, -0.4, 0.4) * prox : 0;
  ham.tilt += (tt - ham.tilt) * Math.min(1, dt * 18);
  hammer.position.set(X3(ham.x), Y3(ham.y), 0);
  hPitch.rotation.z = -ham.tilt;

  for (const n of nails) {
    n.wob = Math.max(0, n.wob - dt * 4);
    n.rise = Math.min(1, n.rise + dt * 3);
    const ease = 1 - Math.pow(1 - n.rise, 3);
    n.mesh.position.x = X3(n.x) + Math.sin(t * 70) * n.wob * 0.22;
    n.mesh.position.y = TOP_Y + (n.bent ? 0 : n.done ? 0.3 - NH_H * SC : n.exposed * SC * ease - (1 - ease) * NH_H * SC);
  }
  for (const n of decor) n.mesh.position.y = TOP_Y + 0.3 - NH_H * SC;
  shake = Math.max(0, shake - dt * 40);
  clouds.rotation.y += dt * 0.004;

  for (const c of chipPool) {
    if (c.life <= 0) continue;
    c.life -= dt; if (c.life <= 0) { c.m.visible = false; continue; }
    c.v.y -= 90 * dt; c.m.position.addScaledVector(c.v, dt);
    c.m.rotation.x += c.r.x * dt; c.m.rotation.y += c.r.y * dt; c.m.rotation.z += c.r.z * dt;
    const p = c.m.position, onTop = Math.hypot(p.x, p.z) < R * 0.95, floor = onTop ? TOP_Y + 0.1 : 0.1;
    if (p.y < floor && (onTop || p.y < TOP_Y - 1)) { p.y = floor; c.v.y *= -0.3; c.v.x *= 0.6; c.v.z *= 0.6; c.r.multiplyScalar(0.5); }
  }
}

let last = performance.now(), prevFrame = last;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt, now / 1000);
  const base = camera.position.clone();
  if (shake > 0) { camera.position.x += (Math.random() - 0.5) * shake * 0.1; camera.position.y += (Math.random() - 0.5) * shake * 0.1; }
  renderer.render(scene, camera);
  prevFrame = performance.now();
  camera.position.copy(base); camera.updateMatrixWorld();
  requestAnimationFrame(frame);
}
resize();
newRound();
requestAnimationFrame(frame);
window.__nail = { get nails() { return nails.map(({ mesh, hole, ...r }) => r); }, get ham() { return ham; }, get lastV() { return lastV; }, toScreen, woodTop };
</script>
