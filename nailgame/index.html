<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>못 박기 3D</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#1d140d;color:#fff;
  font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#gl,#ui{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#gl{touch-action:none;cursor:grab}
#gl.drag{cursor:grabbing}
#ui{pointer-events:none}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(18,10,4,.66);z-index:2}
.overlay.hidden{display:none}
.card{background:#3b2a1c;border:3px solid #c79a5b;border-radius:18px;padding:26px 28px;max-width:420px;margin:16px;
  text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.55)}
h1{margin:0 0 10px;font-size:2.1rem;color:#ffd58a;letter-spacing:2px}
p{margin:8px 0;line-height:1.55;color:#f1e1c8}
.small{font-size:.88rem;opacity:.82}
.score{font-size:1.3rem;font-weight:700;color:#ffd58a}
button{margin-top:14px;font-size:1.15rem;font-weight:800;padding:12px 34px;border:0;border-radius:999px;
  background:#ffb347;color:#3b2a1c;cursor:pointer;box-shadow:0 4px 0 #b86f1d}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #b86f1d}
</style>
<script type="importmap">{ "imports": { "three": "../vendor/three/three.module.min.js" } }</script>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ui"></canvas>
<div class="overlay" id="menu"><div class="card">
  <h1 id="mTitle">🔨 못 박기 3D</h1>
  <div id="mBody">
    <p>망치를 <b>드래그</b>해서 위에서 아래로 힘껏 내려치세요!<br>못이 나무에 완전히 박히면 성공이에요.</p>
    <p class="small">빠르게 휘두를수록 깊이 박혀요.<br>망치 가장자리로 치면 못이 휘어요 (♥ -1).<br>한 번 친 뒤에는 망치를 살짝 들어 올려야 다시 칠 수 있어요.</p>
  </div>
  <button id="startBtn">시작하기</button>
</div></div>
<script type="module">
import * as THREE from 'three';

const glc = document.getElementById('gl'), ui = document.getElementById('ui'), uctx = ui.getContext('2d');
const menu = document.getElementById('menu'), mTitle = document.getElementById('mTitle'),
      mBody = document.getElementById('mBody'), startBtn = document.getElementById('startBtn');

// ---------- 상수 (게임 로직 단위: 1 = 3D 0.1) ----------
const FACE_W = 50, NH_W = 22, NH_H = 7, SC = 0.1, MAX_LIFT = 280;
const REACH = FACE_W / 2 + NH_W / 2, V_MIN = 200, V_MAX = 4000;
const PLANK_H = 6, PLANK_D = 14;
const WOODS = [
  { name: '소나무',  k: 0.020, base: '#dcab6e', dark: '#b8834a', grain: '#94632f' },
  { name: '참나무',  k: 0.013, base: '#ba8653', dark: '#93623a', grain: '#6f4520' },
  { name: '마호가니', k: 0.009, base: '#934d30', dark: '#6e351e', grain: '#4f1e0d' },
  { name: '흑단',    k: 0.0065, base: '#4c3527', dark: '#34241a', grain: '#1c120c' },
];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);
let W = 800;
const woodTop = 372;
const X3 = x => (x - W / 2) * SC, Y3 = y => (woodTop - y) * SC;

// ---------- 렌더러 & 장면 ----------
const renderer = new THREE.WebGLRenderer({ canvas: glc, antialias: true });
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1d140d);
scene.fog = new THREE.Fog(0x1d140d, 140, 320);
const camera = new THREE.PerspectiveCamera(38, 1, 0.5, 600);

(function makeEnv() {
  const s = new THREE.Scene();
  s.add(new THREE.Mesh(new THREE.BoxGeometry(100, 100, 100), new THREE.MeshBasicMaterial({ color: 0x6a5a4c, side: THREE.BackSide })));
  const panel = (c, x, y, z, w, h) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide }));
    m.position.set(x, y, z); m.lookAt(0, 0, 0); s.add(m);
  };
  panel(new THREE.Color(9, 8, 6.6), 0, 45, 12, 60, 30);
  panel(new THREE.Color(3, 3.3, 4), -45, 12, 20, 30, 50);
  panel(new THREE.Color(2.4, 2.2, 2), 0, 10, 48, 60, 24);
  panel(new THREE.Color(1.6, 1.3, 1.0), 42, 6, -18, 22, 30);
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(s, 0.04).texture; pm.dispose();
})();

scene.add(new THREE.HemisphereLight(0xfff1dc, 0x3a2a1c, 0.9));
const sun = new THREE.DirectionalLight(0xffe2b8, 2.1);
sun.position.set(-12, 80, 14); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -60, right: 60, top: 50, bottom: -40, near: 1, far: 200 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xbcd2ff, 0.55); fill.position.set(40, 20, 50); scene.add(fill);

function canvasTex(cv, repX = 1, repY = 1) {
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  t.wrapS = t.wrapT = THREE.MirroredRepeatWrapping; t.repeat.set(repX, repY);
  return t;
}
function paintWood(cv, w, h, c, lines) {
  cv.width = w; cv.height = h;
  const g = cv.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, c.base); gr.addColorStop(1, c.dark);
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  for (let i = 0; i < lines; i++) {
    const y0 = Math.random() * h, amp = rand(1, 7), fr = rand(0.004, 0.016), ph = Math.random() * 7;
    g.strokeStyle = c.grain; g.globalAlpha = rand(0.15, 0.45); g.lineWidth = rand(0.6, 2.6);
    g.beginPath();
    for (let x = 0; x <= w; x += 8) { const y = y0 + Math.sin(x * fr + ph) * amp; x ? g.lineTo(x, y) : g.moveTo(x, y); }
    g.stroke();
  }
  for (let k = 0; k < 3; k++) {
    const kx = Math.random() * w, ky = Math.random() * h, r = rand(8, 16);
    for (let j = 5; j > 0; j--) {
      g.globalAlpha = 0.18 + 0.1 * (5 - j); g.strokeStyle = c.grain; g.lineWidth = 1.5;
      g.beginPath(); g.ellipse(kx, ky, r * j / 3, r * j / 5, 0, 0, 7); g.stroke();
    }
  }
  g.globalAlpha = 1;
}

// 벽(타공판)
{
  const cv = document.createElement('canvas'); cv.width = cv.height = 64;
  const g = cv.getContext('2d'); g.fillStyle = '#3d2e22'; g.fillRect(0, 0, 64, 64);
  g.fillStyle = '#1a120c'; g.beginPath(); g.arc(32, 32, 5, 0, 7); g.fill();
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(500, 220),
    new THREE.MeshStandardMaterial({ map: canvasTex(cv, 125, 55), roughness: 0.95 }));
  wall.position.set(0, 50, -40); wall.receiveShadow = true; scene.add(wall);
}
// 작업대
{
  const cv = document.createElement('canvas');
  paintWood(cv, 512, 256, { base: '#5a3d28', dark: '#3e291a', grain: '#24170e' }, 40);
  const table = new THREE.Mesh(new THREE.BoxGeometry(500, 6, 90),
    new THREE.MeshStandardMaterial({ map: canvasTex(cv, 4, 1), roughness: 0.75 }));
  table.position.set(0, -PLANK_H - 3, 5); table.receiveShadow = true; scene.add(table);
}
// 나무판
const woodCv = document.createElement('canvas');
const woodTex = canvasTex(woodCv);
const plankMat = new THREE.MeshStandardMaterial({ map: woodTex, bumpMap: woodTex, bumpScale: 0.03, roughness: 0.62 });
const plank = new THREE.Mesh(new THREE.BoxGeometry(1, PLANK_H, PLANK_D), plankMat);
plank.position.y = -PLANK_H / 2; plank.castShadow = plank.receiveShadow = true; scene.add(plank);

// ---------- 못 ----------
const steelMat = new THREE.MeshStandardMaterial({ color: 0xd8dde2, metalness: 0.9, roughness: 0.32 });
const brightMat = new THREE.MeshStandardMaterial({ color: 0xe6ebf0, metalness: 1, roughness: 0.18 });
const headGeo = new THREE.CylinderGeometry(NH_W / 2 * SC, NH_W / 2 * SC * 0.9, NH_H * SC, 28); headGeo.translate(0, NH_H * SC / 2, 0);
const shaftDown = new THREE.CylinderGeometry(0.3, 0.3, 1, 12); shaftDown.translate(0, -0.5, 0);
const shaftUp = new THREE.CylinderGeometry(0.3, 0.3, 1, 12); shaftUp.translate(0, 0.5, 0);
const jointGeo = new THREE.SphereGeometry(0.3, 12, 8);
const holeGeo = new THREE.CircleGeometry(1, 24); holeGeo.rotateX(-Math.PI / 2);
const ringGeo = new THREE.RingGeometry(1.25, 1.65, 32); ringGeo.rotateX(-Math.PI / 2);
const decalMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.35, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2 });

function buildNail(n) {
  const g = new THREE.Group();
  const head = new THREE.Mesh(headGeo, steelMat), shaft = new THREE.Mesh(shaftDown, steelMat);
  shaft.scale.y = n.len * SC + 1.5;
  head.castShadow = shaft.castShadow = true;
  g.add(head, shaft); scene.add(g);
  const hole = new THREE.Mesh(holeGeo, decalMat); hole.scale.set(0.75, 1, 0.75); hole.position.y = 0.01; scene.add(hole);
  n.mesh = g; n.hole = hole; n.ring = null;
}
function bendNail(n) {
  const g = n.mesh; g.clear();
  const e = n.exposed * SC, k1 = e * 0.4, len2 = e * 0.75, a = 1.0, s = n.dir;
  const low = new THREE.Mesh(shaftUp, steelMat); low.scale.y = k1;
  const up = new THREE.Mesh(shaftUp, steelMat); up.scale.y = len2; up.position.y = k1; up.rotation.z = -s * a;
  const joint = new THREE.Mesh(jointGeo, steelMat); joint.position.y = k1;
  const head = new THREE.Mesh(headGeo, steelMat);
  head.position.set(s * Math.sin(a) * len2, k1 + Math.cos(a) * len2, 0); head.rotation.z = -s * a;
  [low, up, joint, head].forEach(m => { m.castShadow = true; g.add(m); });
}
function finishNail(n) {
  n.mesh.children[0].material = brightMat;
  const ring = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: 0xfff0b4, transparent: true, opacity: 0.5, depthWrite: false }));
  ring.position.y = 0.03; scene.add(ring); n.ring = ring;
}
function removeNail(n) { scene.remove(n.mesh, n.hole); if (n.ring) { scene.remove(n.ring); n.ring.material.dispose(); } }

// ---------- 망치 ----------
const hammer = new THREE.Group(), hYaw = new THREE.Group(), hPitch = new THREE.Group();
hammer.add(hYaw); hYaw.add(hPitch); hYaw.rotation.y = -0.55; scene.add(hammer);
{
  const add = (geo, mat, x, y, z, rz = 0) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.rotation.z = rz; m.castShadow = true; hPitch.add(m); return m; };
  const headMat = new THREE.MeshStandardMaterial({ color: 0xaab2ba, metalness: 0.9, roughness: 0.38 });
  add(new THREE.CylinderGeometry(2.5, 2.5, 1.5, 36), brightMat, 0, 0.75, 0);          // 타격면
  add(new THREE.CylinderGeometry(1.9, 2.3, 3.2, 36), headMat, 0, 3.1, 0);             // 목
  add(new THREE.BoxGeometry(4.2, 2.8, 3.2), headMat, 0, 6.0, 0);                      // 눈
  const sh = new THREE.Shape();
  sh.moveTo(-1.7, 0); sh.quadraticCurveTo(-2.3, 2.6, 1.4, 4.0); sh.quadraticCurveTo(-0.2, 1.8, 1.7, 0); sh.closePath();
  const claw = new THREE.ExtrudeGeometry(sh, { depth: 2.4, bevelEnabled: true, bevelSize: 0.2, bevelThickness: 0.2, bevelSegments: 2 });
  claw.translate(0, 7.2, -1.2);
  add(claw, headMat, 0, 0, 0);                                                         // 노루발
  const woodMat = new THREE.MeshStandardMaterial({ color: 0xc48c4c, roughness: 0.55 });
  const handle = add(new THREE.CylinderGeometry(0.85, 1.0, 19, 20), woodMat, 11.0, 6.0, 0, Math.PI / 2); handle.scale.z = 0.8;
  const gripMat = new THREE.MeshStandardMaterial({ color: 0xb32a20, roughness: 0.85 });
  add(new THREE.CylinderGeometry(1.25, 1.2, 8.2, 24), gripMat, 16.9, 6.0, 0, Math.PI / 2);
  const cap = add(new THREE.SphereGeometry(1.25, 20, 12), gripMat, 21.0, 6.0, 0); cap.scale.x = 0.5;
  const rib = new THREE.TorusGeometry(1.26, 0.1, 6, 24); rib.rotateY(Math.PI / 2);
  for (let gx = 13.6; gx < 20.6; gx += 1.2) add(rib, new THREE.MeshStandardMaterial({ color: 0x7a1a14, roughness: 0.9 }), gx, 6.0, 0);
}

// ---------- 파티클 ----------
const SPK = 260;
const spPos = new Float32Array(SPK * 3), spCol = new Float32Array(SPK * 3);
const spGeo = new THREE.BufferGeometry();
spGeo.setAttribute('position', new THREE.BufferAttribute(spPos, 3));
spGeo.setAttribute('color', new THREE.BufferAttribute(spCol, 3));
const dot = document.createElement('canvas'); dot.width = dot.height = 32;
{ const g = dot.getContext('2d'), r = g.createRadialGradient(16, 16, 0, 16, 16, 16); r.addColorStop(0, '#fff'); r.addColorStop(0.4, 'rgba(255,255,255,.7)'); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0, 0, 32, 32); }
const sparkPts = new THREE.Points(spGeo, new THREE.PointsMaterial({ size: 0.6, map: new THREE.CanvasTexture(dot), vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
sparkPts.frustumCulled = false; scene.add(sparkPts);
let sparks = [];
const chipGeo = new THREE.BoxGeometry(0.9, 0.22, 0.55);
const chipMats = [new THREE.MeshStandardMaterial({ roughness: 0.8 }), new THREE.MeshStandardMaterial({ roughness: 0.8 })];
const chipPool = [];
for (let i = 0; i < 90; i++) { const m = new THREE.Mesh(chipGeo, chipMats[i % 2]); m.visible = false; scene.add(m); chipPool.push({ m, life: 0 }); }

function spawnSparks(x, y, n) {
  for (let i = 0; i < n && sparks.length < SPK; i++) {
    const a = rand(0.15, Math.PI - 0.15), sp = rand(15, 50), az = rand(-1, 1);
    sparks.push({ x: X3(x), y: Y3(y), z: 0, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, vz: az * sp * 0.6, life: rand(0.15, 0.4), max: 0.4 });
  }
}
function spawnChips(x, y, n) {
  for (let i = 0; i < n; i++) {
    const c = chipPool.find(p => p.life <= 0); if (!c) return;
    const a = rand(0.3, Math.PI - 0.3), sp = rand(8, 28);
    c.life = rand(0.6, 1.0); c.m.visible = true;
    c.m.position.set(X3(x) + rand(-1.4, 1.4), Y3(y) + 0.2, rand(-1, 1));
    c.v = new THREE.Vector3(Math.cos(a) * sp, Math.sin(a) * sp, rand(-10, 10));
    c.r = new THREE.Vector3(rand(-14, 14), rand(-14, 14), rand(-14, 14));
  }
}

// ---------- 사운드 ----------
let AC = null, noiseBuf = null;
function initAudio() {
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.5, AC.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { AC = null; }
}
function tone(f, dur, type, vol, f2, delay = 0) {
  if (!AC) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, freq) {
  if (!AC) return;
  const t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f).connect(g).connect(AC.destination); s.start(t); s.stop(t + dur);
}
const sfx = {
  hit(p, s) { tone(1300 + p * 900, 0.22, 'triangle', 0.18 + s * 0.12); tone(2900 + p * 1400, 0.1, 'sine', 0.08); noise(0.07, 0.35 + s * 0.3, 2200); tone(160, 0.08, 'sine', 0.3, 80); },
  done() { tone(200, 0.25, 'sine', 0.5, 90); noise(0.12, 0.5, 700); tone(988, 0.12, 'triangle', 0.15, 0, 0.05); tone(1319, 0.2, 'triangle', 0.15, 0, 0.12); },
  bend() { tone(1100, 0.45, 'sawtooth', 0.09, 260); tone(700, 0.3, 'square', 0.05, 200); noise(0.1, 0.3, 1500); },
  wood(s) { noise(0.14, 0.4 + s * 0.4, 450); tone(130, 0.16, 'sine', 0.4, 55); },
  tap() { tone(1800, 0.05, 'triangle', 0.05); },
  clank() { tone(620, 0.14, 'square', 0.06, 500); noise(0.05, 0.2, 2500); },
  clear() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.25, 'triangle', 0.16, 0, i * 0.1)); },
  over() { [392, 330, 262, 196].forEach((f, i) => tone(f, 0.32, 'triangle', 0.16, 0, i * 0.16)); },
};

// ---------- 게임 상태 ----------
let state = 'menu', stage = 1, score = 0, lives = 3, combo = 0, timeLeft = 0, timeMax = 1, stateT = 0, firstHit = false;
let wood = WOODS[0], best = 0;
let nails = [], dents = [], pops = [], shake = 0;
const ham = { x: 400, y: woodTop - 190, armed: true, tilt: 0, hitY: 1e9 };
const target = { x: 400, y: woodTop - 190 };
let lastV = 0, drag = null, lastP = { x: 0, y: 0 };
const samples = [];
try { best = +localStorage.getItem('nailgame.best') || 0; } catch (e) {}

function headTop(n) {
  if (n.done) return woodTop - 3;
  if (n.bent) return woodTop - n.exposed * 0.45 - 3;
  return woodTop - n.exposed - NH_H;
}
function floorAt(x) {
  let y = woodTop, nail = null;
  for (const n of nails) if (Math.abs(x - n.x) < REACH) { const t = headTop(n); if (t < y) { y = t; nail = n; } }
  return { y, nail };
}

function startStage() {
  const wi = Math.min(Math.floor((stage - 1) / 2), WOODS.length - 1);
  wood = WOODS[wi];
  nails.forEach(removeNail); dents.forEach(d => scene.remove(d.m));
  nails = []; dents = [];
  const count = Math.min(2 + stage, Math.floor((W - 60) / 95)), slot = (W - 60) / count;
  for (let i = 0; i < count; i++) {
    const j = Math.max(0, (slot - 95) / 2);
    const len = rand(55, 95) + Math.min(stage * 3, 25);
    const n = { x: 30 + slot * (i + 0.5) + rand(-j, j), len, exposed: len, hits: 0, done: false, bent: false, dir: 1, wob: 0 };
    buildNail(n); nails.push(n);
  }
  timeMax = timeLeft = Math.round(10 + count * (3.5 + wi * 1.6));
  ham.y = Math.min(ham.y, woodTop - 170); ham.armed = true; ham.hitY = 1e9;
  if (drag) { drag.dx = ham.x - lastP.x; drag.dy = ham.y - lastP.y; }
  target.x = ham.x; target.y = ham.y;
  paintWood(woodCv, 1024, 256, wood, 50); woodTex.needsUpdate = true;
  chipMats[0].color.set(wood.base); chipMats[1].color.set(wood.dark);
  state = 'play';
  pops.push({ center: true, text: `STAGE ${stage} · ${wood.name}`, color: '#ffd58a', life: 1.6, max: 1.6, big: true });
}

function newGame() {
  stage = 1; score = 0; lives = 3; combo = 0; firstHit = false;
  ham.x = W / 2; ham.y = woodTop - 190; ham.tilt = 0;
  menu.classList.add('hidden');
  startStage();
}

function gameOver(reason) {
  if (state !== 'play') return;
  state = 'over'; stateT = 1.1; sfx.over();
  const isBest = score > best;
  if (isBest) { best = score; try { localStorage.setItem('nailgame.best', best); } catch (e) {} }
  mTitle.textContent = '게임 오버';
  mBody.innerHTML = `<p>${reason}</p><p class="score">점수 ${score}${isBest ? ' 🏆 최고 기록!' : ''}</p>
    <p class="small">스테이지 ${stage} · 최고 기록 ${best}</p>`;
  startBtn.textContent = '다시 하기';
}

function checkStage() {
  if (state === 'play' && nails.every(n => n.done || n.bent)) {
    const bonus = Math.ceil(timeLeft) * 10;
    score += bonus; state = 'clear'; stateT = 2; sfx.clear();
    pops.push({ center: true, text: 'STAGE CLEAR!', color: '#7dff9b', life: 2, max: 2, big: true });
    pops.push({ center: true, dy: 46, text: `시간 보너스 +${bonus}`, color: '#fff', life: 2, max: 2 });
  }
}

// ---------- 충돌 & 타격 ----------
function pointerVy() {
  const now = performance.now();
  if (samples.length < 2) return 0;
  const last = samples[samples.length - 1];
  if (last.rt <= prevFrame && now - last.rt > 100) return 0;   // 이번 프레임에 새 입력이 없고 오래됐으면 정지 상태
  let old = last;
  for (let i = samples.length - 1; i >= 0; i--) { old = samples[i]; if (last.t - old.t >= 45) break; }
  const dt = (last.t - old.t) / 1000;
  return dt > 0 ? (last.y - old.y) / dt : 0;
}

function tryX(nx) {
  for (const n of nails) {
    if (Math.abs(nx - n.x) >= REACH) continue;
    const t = headTop(n);
    if (ham.y > t + 0.5) { if (ham.y - t <= 10) ham.y = t; else return; }
  }
  ham.x = nx;
}

function moveHammer() {
  if (ham.y < Math.min(floorAt(ham.x).y, ham.hitY) - 12) ham.armed = true;
  if (!drag) return;
  const tx = clamp(target.x, FACE_W / 2 + 2, W - FACE_W / 2 - 2), ty = clamp(target.y, woodTop - MAX_LIFT, woodTop + 200);
  const dx = tx - ham.x, dy = ty - ham.y;
  const steps = Math.min(300, Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) / 4)));
  const sx = dx / steps, sy = dy / steps;
  for (let i = 0; i < steps; i++) {
    tryX(ham.x + sx);
    let ny = ham.y + sy;
    if (sy > 0) {
      const f = floorAt(ham.x);
      if (ny >= f.y) { if (ham.armed) contact(f.nail); ny = f.y; }
    }
    ham.y = ny;
  }
}

function contact(n) {
  if (!ham.armed || state === 'over') return;
  ham.armed = false; ham.hitY = ham.y;
  const v = Math.min(pointerVy(), V_MAX); lastV = v;
  if (n) impact(n, v); else woodHit(v);
}

function woodHit(v) {
  if (v < 500) { if (v > V_MIN) sfx.wood(0.1); return; }
  const s = Math.min(1, v / 3000);
  sfx.wood(s); shake = Math.max(shake, 2 + s * 5);
  const m = new THREE.Mesh(holeGeo, decalMat);
  m.scale.set((8 + s * 9) * SC * 1.6, 1, 0.9); m.position.set(X3(ham.x), 0.012, 0);
  scene.add(m); dents.push({ x: ham.x, m });
  spawnChips(ham.x, woodTop, 4 + s * 8);
}

function impact(n, v) {
  if (n.done || n.bent) { sfx.clank(); spawnSparks(n.x, headTop(n), 4); return; }
  if (v < V_MIN) { sfx.tap(); return; }
  n.hits++; n.wob = 1; firstHit = true;
  const dxh = ham.x - n.x, r = Math.abs(dxh) / REACH;
  if (r > 0.72 && v > 700) {
    n.bent = true; n.dir = dxh < 0 ? 1 : -1; lives--; combo = 0;
    bendNail(n);
    sfx.bend(); shake = 9; spawnSparks(n.x, headTop(n), 12);
    pops.push({ x: n.x, y: headTop(n) - 60, text: '휘었다! ♥-1', color: '#ff6b6b', life: 1.2, max: 1.2 });
    if (lives <= 0) gameOver('못이 전부 휘어버렸어요!'); else checkStage();
    return;
  }
  const eff = 1 - 0.55 * r * r;
  const d = Math.min(n.exposed, (v - V_MIN) * wood.k * eff);
  n.exposed -= d;
  const s = Math.min(1, v / 3000);
  sfx.hit(1 - n.exposed / n.len, s);
  spawnSparks(n.x, headTop(n), 6 + s * 12);
  shake = Math.max(shake, Math.min(10, 1.5 + d * 0.25));
  if (r > 0.45) pops.push({ x: n.x, y: headTop(n) - 40, text: '아슬아슬!', color: '#ffb36b', life: 0.8, max: 0.8 });
  if (n.exposed <= 0.5) {
    n.exposed = 0; n.done = true; combo++;
    finishNail(n);
    const par = Math.max(1, Math.ceil(n.len / (1800 * wood.k)));
    let pts = 100, txt = 'GOOD', col = '#ffffff';
    if (n.hits === 1) { pts = 300; txt = 'ONE SHOT!'; col = '#ffd84d'; }
    else if (n.hits <= par) { pts = 150; txt = 'PERFECT!'; col = '#7dff9b'; }
    const mult = Math.min(2, 1 + (combo - 1) * 0.1);
    pts = Math.round(pts * mult); score += pts;
    pops.push({ x: n.x, y: woodTop - 50, text: txt, color: col, life: 1.2, max: 1.2 });
    pops.push({ x: n.x, y: woodTop - 50, dy: 24, text: `+${pts}` + (combo > 1 ? ` (${combo}콤보)` : ''), color: '#fff', life: 1.2, max: 1.2, small: true });
    sfx.done(); spawnChips(n.x, woodTop, 12); shake = Math.max(shake, 7);
    checkStage();
  }
}

// ---------- 화면 / 카메라 ----------
let vw = 1, vh = 1, DPR = 1;
const camTarget = new THREE.Vector3();
function resize() {
  vw = innerWidth; vh = innerHeight; DPR = Math.min(devicePixelRatio || 1, 2);
  renderer.setPixelRatio(DPR); renderer.setSize(vw, vh, false);
  ui.width = Math.round(vw * DPR); ui.height = Math.round(vh * DPR);
  const oldW = W, portrait = vh > vw;
  W = portrait ? 420 : 800;
  if (oldW !== W) { const f = W / oldW; nails.forEach(n => n.x *= f); dents.forEach(d => { d.x *= f; d.m.position.x = X3(d.x); }); ham.x *= f; target.x *= f; }
  plank.scale.x = W * SC + 14;
  camera.aspect = vw / vh; camera.fov = portrait ? 46 : 36;
  const t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const halfW = W * SC / 2 + 5, halfH = portrait ? 24 : 21;
  const d = Math.max(halfW / (t * camera.aspect), halfH / t);
  const el = THREE.MathUtils.degToRad(portrait ? 30 : 20);
  camTarget.set(0, portrait ? 7 : 10.5, 0);
  camera.position.set(0, camTarget.y + Math.sin(el) * d, Math.cos(el) * d);
  camera.lookAt(camTarget); camera.updateProjectionMatrix(); camera.updateMatrixWorld();
  scene.fog.near = d * 1.4; scene.fog.far = d * 3.2;
}
const _v = new THREE.Vector3();
function toScreen(x, y) { _v.set(X3(x), Y3(y), 0).project(camera); return { x: (_v.x + 1) / 2 * vw, y: (1 - _v.y) / 2 * vh }; }

// ---------- 입력 ----------
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0), hitP = new THREE.Vector3();
function toWorld(e) {
  ndc.set(e.clientX / vw * 2 - 1, -(e.clientY / vh) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  if (!ray.ray.intersectPlane(plane, hitP)) return lastP;
  return { x: hitP.x / SC + W / 2, y: woodTop - hitP.y / SC };
}
glc.addEventListener('pointerdown', e => {
  initAudio();
  if ((state !== 'play' && state !== 'clear') || drag) return;
  const p = toWorld(e); lastP = p;
  drag = { id: e.pointerId, dx: ham.x - p.x, dy: ham.y - p.y };
  target.x = ham.x; target.y = ham.y; samples.length = 0;
  try { glc.setPointerCapture(e.pointerId); } catch (_) {}
  glc.classList.add('drag');
});
glc.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const list = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
  const now = performance.now();
  for (const ce of (list.length ? list : [e])) { const p = toWorld(ce); lastP = p; samples.push({ t: ce.timeStamp > 0 && Math.abs(now - ce.timeStamp) < 1000 ? ce.timeStamp : now, rt: now, y: p.y + drag.dy }); }
  while (samples.length > 2 && now - samples[0].rt > 400) samples.shift();
  target.x = lastP.x + drag.dx; target.y = lastP.y + drag.dy;
});
function endDrag(e) { if (drag && e.pointerId === drag.id) { drag = null; glc.classList.remove('drag'); } }
glc.addEventListener('pointerup', endDrag);
glc.addEventListener('pointercancel', endDrag);
startBtn.addEventListener('click', () => { initAudio(); newGame(); });
addEventListener('resize', resize);

// ---------- 업데이트 ----------
function update(dt, t) {
  if (state === 'play') {
    timeLeft -= dt;
    if (timeLeft <= 0) { timeLeft = 0; gameOver('시간이 다 됐어요!'); }
  } else if (state === 'clear') {
    stateT -= dt; if (stateT <= 0) { stage++; startStage(); }
  } else if (state === 'over') {
    stateT -= dt; if (stateT <= 0 && menu.classList.contains('hidden')) { menu.classList.remove('hidden'); drag = null; glc.classList.remove('drag'); }
  }
  if (state === 'play' || state === 'clear') moveHammer();

  const prox = clamp((floorAt(ham.x).y - ham.y) / 50, 0, 1);
  const tt = drag ? clamp(-pointerVy() * 0.00008, -0.4, 0.4) * prox : 0;
  ham.tilt += (tt - ham.tilt) * Math.min(1, dt * 18);
  hammer.visible = state !== 'menu';
  hammer.position.set(X3(ham.x), Y3(ham.y), 0);
  hPitch.rotation.z = -ham.tilt;

  for (const n of nails) {
    n.wob = Math.max(0, n.wob - dt * 4);
    const wx = X3(n.x);
    n.mesh.position.x = wx + Math.sin(t * 70) * n.wob * 0.22;
    n.mesh.position.y = n.bent ? 0 : n.done ? 0.3 - NH_H * SC : n.exposed * SC;
    n.hole.position.x = wx;
    if (n.ring) { n.ring.position.x = wx; n.ring.material.opacity = 0.35 + 0.25 * Math.sin(t * 5 + n.x); }
  }
  shake = Math.max(0, shake - dt * 40);

  let i = 0;
  for (const p of sparks) {
    p.life -= dt; p.vy -= 60 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    if (p.life > 0) sparks[i++] = p;
  }
  sparks.length = i;
  for (let k = 0; k < SPK; k++) {
    const p = sparks[k];
    if (p) { const a = p.life / p.max; spPos.set([p.x, p.y, p.z], k * 3); spCol.set([a, a * 0.8, a * 0.45], k * 3); }
    else spPos[k * 3 + 1] = -999;
  }
  spGeo.attributes.position.needsUpdate = true; spGeo.attributes.color.needsUpdate = true;
  for (const c of chipPool) {
    if (c.life <= 0) continue;
    c.life -= dt; if (c.life <= 0) { c.m.visible = false; continue; }
    c.v.y -= 90 * dt; c.m.position.addScaledVector(c.v, dt);
    c.m.rotation.x += c.r.x * dt; c.m.rotation.y += c.r.y * dt; c.m.rotation.z += c.r.z * dt;
    if (c.m.position.y < 0.1) { c.m.position.y = 0.1; c.v.y *= -0.3; c.v.x *= 0.6; c.v.z *= 0.6; c.r.multiplyScalar(0.5); }
  }
  for (const p of pops) p.life -= dt;
  pops = pops.filter(p => p.life > 0);
}

// ---------- 2D UI ----------
function rr(g, x, y, w, h, r) { g.beginPath(); if (g.roundRect) g.roundRect(x, y, w, h, r); else g.rect(x, y, w, h); }
function drawUI(t) {
  const g = uctx;
  g.setTransform(DPR, 0, 0, DPR, 0, 0); g.clearRect(0, 0, vw, vh);
  if (state === 'menu') return;
  g.textAlign = 'center'; g.lineJoin = 'round';
  if (state === 'play' && !firstHit && stage === 1 && nails[0]) {
    const n = nails[0], s = toScreen(n.x, headTop(n)), by = s.y - 26 - Math.abs(Math.sin(t * 4)) * 12;
    g.fillStyle = '#ffd58a'; g.font = '800 16px system-ui,sans-serif';
    g.lineWidth = 4; g.strokeStyle = 'rgba(30,15,5,.8)'; g.strokeText('망치로 쾅!', s.x, by - 20); g.fillText('망치로 쾅!', s.x, by - 20);
    g.beginPath(); g.moveTo(s.x - 9, by - 12); g.lineTo(s.x + 9, by - 12); g.lineTo(s.x, by); g.fill();
  }
  for (const p of pops) {
    const a = clamp(p.life / p.max * 2, 0, 1), age = p.max - p.life, sz = p.big ? 40 : p.small ? 15 : 22;
    let x, y;
    if (p.center) { x = vw / 2; y = vh * 0.3 + (p.dy || 0) - age * 10; }
    else { const s = toScreen(p.x, p.y); x = s.x; y = s.y + (p.dy || 0) - age * 30; }
    g.globalAlpha = a; g.font = `900 ${sz}px system-ui,sans-serif`;
    g.lineWidth = sz * 0.22; g.strokeStyle = 'rgba(30,15,5,.85)'; g.strokeText(p.text, x, y);
    g.fillStyle = p.color; g.fillText(p.text, x, y);
  }
  g.globalAlpha = 1;
  // HUD
  const m = Math.max(14, Math.min(28, vw * 0.03));
  g.textAlign = 'left'; g.fillStyle = '#ffd58a'; g.font = '800 18px system-ui,sans-serif';
  g.strokeStyle = 'rgba(0,0,0,.5)'; g.lineWidth = 3;
  g.strokeText(`STAGE ${stage} · ${wood.name}`, m, 30); g.fillText(`STAGE ${stage} · ${wood.name}`, m, 30);
  const left = nails.filter(n => !n.done && !n.bent).length, info = `점수 ${score}   남은 못 ${left}/${nails.length}`;
  g.fillStyle = '#fff'; g.font = '700 15px system-ui,sans-serif'; g.strokeText(info, m, 52); g.fillText(info, m, 52);
  g.textAlign = 'right'; g.font = '20px system-ui,sans-serif';
  g.fillStyle = '#ff5a5a'; g.fillText('♥'.repeat(Math.max(0, lives)), vw - m, 32);
  g.fillStyle = 'rgba(255,255,255,.35)'; g.fillText('♥'.repeat(Math.max(0, 3 - lives)), vw - m - 20 * Math.max(0, lives), 32);
  const bw = vw - m * 2, ratio = clamp(timeLeft / timeMax, 0, 1);
  g.fillStyle = 'rgba(0,0,0,.45)'; rr(g, m, 64, bw, 10, 5); g.fill();
  g.fillStyle = ratio < 0.25 ? '#ff5a5a' : ratio < 0.5 ? '#ffb347' : '#7dd87a';
  if (ratio > 0) { rr(g, m, 64, bw * ratio, 10, 5); g.fill(); }
  g.fillStyle = '#fff'; g.font = '700 13px system-ui,sans-serif'; g.fillText(`${Math.ceil(timeLeft)}초`, vw - m, 92);
}

let last = performance.now(), prevFrame = last;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const t = now / 1000;
  update(dt, t);
  const base = camera.position.clone();
  if (shake > 0) { camera.position.x += (Math.random() - 0.5) * shake * 0.12; camera.position.y += (Math.random() - 0.5) * shake * 0.12; }
  renderer.render(scene, camera);
  prevFrame = performance.now();
  camera.position.copy(base); camera.updateMatrixWorld();
  drawUI(t);
  requestAnimationFrame(frame);
}
resize();
paintWood(woodCv, 1024, 256, wood, 50); woodTex.needsUpdate = true;
requestAnimationFrame(frame);
window.__nail = { get state() { return state; }, get nails() { return nails.map(({ mesh, hole, ring, ...r }) => r); }, get ham() { return ham; }, get score() { return score; }, get lastV() { return lastV; }, toScreen };
</script>
</body>
