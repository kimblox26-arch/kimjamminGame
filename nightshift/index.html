<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070c">
<title>야간 편의점</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "../vendor/three/three.module.min.js", "three/addons/": "../vendor/three/addons/" } }
</script>
</head>
<body>
<canvas id="gl"></canvas>

<!-- 로딩 -->
<div id="loading" class="screen show">
  <div class="load-box"><svg class="logo-svg" viewBox="0 0 360 120" aria-label="달빛24"><defs><linearGradient id="lg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#ffb21f"/></linearGradient><mask id="mm"><rect width="120" height="120" fill="#fff"/><circle cx="76" cy="44" r="40" fill="#000"/></mask></defs><circle cx="56" cy="60" r="46" fill="url(#lg)" mask="url(#mm)"/><text x="116" y="82" font-size="64" font-weight="900" fill="#fff" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif">달빛<tspan fill="#2fd3b4">24</tspan></text><text x="120" y="110" font-size="17" font-weight="700" fill="#9fb0c4" letter-spacing="5" font-family="sans-serif">NIGHT SHIFT</text></svg><div class="bar"><i id="loadbar"></i></div><p id="loadtxt">편의점 문 여는 중…</p></div>
</div>

<!-- 메인 화면 -->
<div id="menu" class="screen">
  <div class="menu-left">
    <div class="brand"><svg class="logo-svg" viewBox="0 0 360 120" aria-label="달빛24"><defs><linearGradient id="lg2" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#ffb21f"/></linearGradient><mask id="mm2"><rect width="120" height="120" fill="#fff"/><circle cx="76" cy="44" r="40" fill="#000"/></mask></defs><circle cx="56" cy="60" r="46" fill="url(#lg2)" mask="url(#mm2)"/><text x="116" y="82" font-size="64" font-weight="900" fill="#fff" font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif">달빛<tspan fill="#2fd3b4">24</tspan></text><text x="120" y="110" font-size="17" font-weight="700" fill="#9fb0c4" letter-spacing="5" font-family="sans-serif">NIGHT SHIFT</text></svg></div>
    <h1>야간 편의점</h1>
    <p class="sub">밤 10시부터 아침 6시까지. 계산, 거스름돈, 담배, 진상 손님… 전부 당신 몫.</p>
    <label class="name">명찰 이름 <input id="pname" maxlength="4" value="김잼민"></label>
    <button class="btn big" id="bStart">출근하기</button>
    <button class="btn" id="bNew">처음부터 (1일차)</button>
    <button class="btn" id="bHelp">근무 수칙</button>
    <button class="btn" id="bSet">설정</button>
    <p class="rec" id="record"></p>
  </div>
</div>

<!-- HUD -->
<div id="hud" class="hidden thumb">
  <div class="top">
    <div class="clock"><b id="clock">22:00</b><span id="day">1일차</span></div>
    <div class="stat"><span>매출</span><b id="sales">0원</b></div>
    <div class="stat" style="display:none"><span>평판</span><b id="rep"></b></div>
    <div class="cctv" id="cctv" title="CCTV"><span data-ic="cctv"></span> CCTV</div>
    <div class="stat money"><span>지갑</span><b id="money">0원</b></div>
    <div id="stars"></div>
    <button class="ic" id="bPhone" title="휴대폰"><svg viewBox="0 0 24 24" width="22" height="22"><rect x="6" y="2" width="12" height="20" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="18.5" r="1" fill="currentColor"/></svg></button>
    <button class="ic" id="bPause" data-ic="pause"></button>
  </div>
  <div id="sub" class="subtitle"></div>
  <div id="mine" class="mine"></div>
  <div id="cust" class="cust hidden"><div class="cname" id="cname"></div><div class="mood"><i id="moodbar"></i></div><div class="want" id="cwant"></div></div>
  <canvas id="mmap" title="지도"></canvas>
  <div id="objective"><em>▲</em><b></b><i></i></div>
  <div id="hpbar"><i></i></div>
  <div id="speedo"></div>
  <button class="round-act view" id="bView"><b>시점</b></button><button class="round-act horn" id="bHorn"><b>경적</b></button>
  <div id="dot"><i></i></div><div id="aimLabel"></div>
  <div id="choices" class="choices hidden"></div>
  <div id="joy"><i></i></div>
  <button class="round-act run" id="bRun"><b>달리기</b></button>
  <button class="round-act ride hidden" id="bRide"><span data-ic="car"></span><b>차 타기</b></button>
  <div class="side-acts"><button class="round-act atk" id="bAtk"><span data-ic="gun"></span><b>발사</b></button><button class="round-act wpn hidden" id="bWpn"><span data-ic="gun"></span><b>총 꺼내기</b></button></div>
  <div class="bottom">
    <button class="act" id="bTurn"><span data-ic="turn"></span>뒤돌기</button>
    <button class="act" id="bBag"><span data-ic="bag"></span>봉투</button>
    <button class="big-act scan" id="bScan"><span data-ic="scan"></span><b>바코드 찍기</b></button>
    <button class="big-act pay" id="bPay"><span data-ic="pos"></span><b>계산하기</b></button>
    <button class="mic" id="bMic"><span data-ic="mic"></span><em id="micTxt">누르고 말하기</em><i id="micLvl"></i></button>
    <button class="act red" id="b112"><span data-ic="siren"></span>112</button>
  </div>
  <div id="hint" class="hint"></div>
</div>

<!-- 신분증 -->
<div id="idcard" class="panel hidden">
  <div class="idc">
    <div class="idc-card"><div class="idc-title">주민등록증</div><div class="idc-photo" id="idPhoto"></div>
      <div class="idc-info"><b id="idName">홍길동</b><span id="idNum">080512-3******</span><small id="idAddr">서울특별시 마포구</small><small class="idc-date">2024. 3. 2.</small><small>서울특별시 마포구청장</small></div></div>
    <p class="idc-q">2026년 기준, <b>2007년생</b>까지 술·담배 구매 가능</p>
    <div class="row"><button id="idOk" class="green">판매하기</button><button id="idNo" class="red">판매 거절</button></div>
  </div>
</div>

<!-- 일시정지/설정/도움말/결과 -->
<div id="modal" class="panel hidden"><div class="modal"><div id="modalBody"></div><div class="row" id="modalBtns"></div></div></div>
<div id="bigmap" class="hidden"><canvas></canvas><div class="mleg"><span><i style="background:#ffd36b"></i>나</span><span><i style="background:#2fd3b4"></i>편의점</span><span><i style="background:#c9a26b"></i>창고</span><span><i style="background:#f2f2f2"></i>사람</span><span><i style="background:#3b7bff"></i>경찰</span><span><i style="background:#b3131b"></i>쓰러진 사람</span><span><i style="background:#e0785a"></i>교도소</span><span><i style="background:#9b8cff"></i>달빛타워</span><span><i style="background:#ffb84a;border-radius:2px"></i>탈 것</span></div><div class="mzoom"><button data-z="1.6">+</button><button data-z="0.625">−</button><button data-z="0">내 위치</button></div><p class="mclose">끌어서 이동 · 누르면 닫혀요</p></div>
<div id="toast"></div>
<div id="fade"></div>
<div id="hurtfx"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
