<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>가족 타워 디펜스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div id="money"><img class="coin" src="assets/ui/coin.png" alt=""><b id="moneyVal">0</b><span class="won">원</span></div>

  <button id="enemyBtn" class="btn sq up" type="button">
    <span class="name">잼민이 강화</span>
    <span class="count">Lv.1</span>
    <span class="cost"><img class="coin" src="assets/ui/coin.png" alt=""><span class="costVal"></span></span>
  </button>

  <button id="familyBtn" class="btn sq" type="button">
    <span class="name">아기 생성</span>
    <span class="count"></span>
    <span class="cost"><img class="coin" src="assets/ui/coin.png" alt=""><span class="costVal"></span></span>
    <i class="lock" data-svg="lock"></i>
  </button>

  <div id="shop"></div>

  <button id="goBtn" class="btn wide" type="button"><span class="pic"></span><span class="label">타워로 가기</span></button>

  <div id="banners"></div>
  <div id="toast"></div>
  <div id="fade"></div>
</div>
<script src="art.js"></script>
<script src="game.js"></script>
</body>
</html>
