<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>가족 타워 디펜스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div id="money"><i class="ico" data-icon="coin"></i><b id="moneyVal">0</b><span class="won">원</span></div>

  <button id="familyBtn" class="btn sq" data-scene="battle" type="button">
    <span class="frame"><i class="ico" data-icon="family"></i></span>
    <span class="name">가족 생성</span>
    <span class="cost"><i class="ico" data-icon="coin"></i><span class="costVal">10원</span></span>
    <i class="ico lock" data-icon="lock"></i>
  </button>

  <button id="goBtn" class="btn wide" type="button"><i class="ico"></i><span class="label">타워로 가기</span></button>

  <div id="toast" class="plaque"></div>
  <div id="fade"></div>
</div>
<script src="game.js"></script>
</body>
</html>
