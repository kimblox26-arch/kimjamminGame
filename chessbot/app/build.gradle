plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kimjammin.chessbot'
    compileSdk 34

    defaultConfig {
        applicationId 'com.kimjammin.chessbot'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    packaging {
        // Stockfish 실행 파일(libstockfish.so)을 설치 시 풀어 둬야 실행할 수 있다
        jniLibs { useLegacyPackaging true }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
