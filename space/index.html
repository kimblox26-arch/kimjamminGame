<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>구슬 우주 (알파)</title>
<link rel="stylesheet" href="./style.css">
<script type="importmap">
{ "imports": { "three": "../vendor/three/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="view"></canvas>
<canvas id="overlay"></canvas>

<div id="search-box">
  <input id="search" type="search" placeholder="행성 검색 (예: 지구, 목성, Mars)" autocomplete="off" spellcheck="false">
  <label id="count-box">구슬 개수 <input id="count" type="number" min="20" max="20000" step="10" value="800"></label>
  <ul id="results"></ul>
</div>

<div id="controls">
  <button id="pause" title="일시정지 (Space)">⏸</button>
  <label class="speed">
    <input id="speed" type="range" min="0" max="5" step="0.01" value="2.78">
    <span id="speed-label"></span>
  </label>
  <button id="clear" title="모두 지우기">초기화</button>
</div>

<div id="status"></div>
<div id="hint"></div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
