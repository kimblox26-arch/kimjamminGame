<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>tikball box 홍보영상</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#111;display:flex;align-items:center;justify-content:center}
  canvas{height:100vh;max-width:100vw;aspect-ratio:9/16;background:#fff}
  #go{position:fixed;inset:0;margin:auto;width:220px;height:60px;border:0;border-radius:8px;background:#FE2C55;color:#fff;font:700 20px sans-serif;cursor:pointer}
</style>
</head>
<body>
<canvas id="cv" width="720" height="1280"></canvas>
<button id="go">홍보영상 재생</button>
<script src="js/config.js"></script>
<script src="js/icons.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/media.js"></script>
<script src="js/settings.js"></script>
<script src="js/game.js"></script>
<script src="js/skillspec.js"></script>
<script src="js/skilledit.js"></script>
<script>
'use strict';
// ===== tikball box 홍보영상 (9:16, 약 22초) =====
// 게임 엔진을 그대로 써서 장면을 그리고, ?rec=1 이면 소리까지 함께 webm 으로 저장해요.
const W = 720, H = 1280, DUR = 25, cv = document.getElementById('cv'), c = cv.getContext('2d');
const FONT = "'IBM Plex Sans KR','WenQuanYi Zen Hei','Apple SD Gothic Neo',sans-serif";
const PK = '#FE2C55', CY = '#25F4EE';
const ez = t => t < 0 ? 0 : t > 1 ? 1 : 1 - Math.pow(1 - t, 3);            // ease-out
const pop = t => t <= 0 ? 0 : t >= 1 ? 1 : 1 + 2.2 * Math.pow(t - 1, 3) + 1.2 * Math.pow(t - 1, 2); // 살짝 튀어나옴
const iconImg = (n, col) => { const i = new Image(); i.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`); return i; };
const ICO = { flask: iconImg('flask', PK), users: iconImg('users', '#1c7ed6'), trophy: iconImg('trophy', '#f59f00'), film: iconImg('film', '#7048e8') };
function drawBadge(x, y, r) { // 인증마크
  c.save(); c.translate(x, y); c.fillStyle = '#20D5EC'; c.beginPath(); c.arc(0, 0, r, 0, 7); c.fill();
  c.strokeStyle = '#fff'; c.lineWidth = r * .24; c.lineCap = 'round'; c.lineJoin = 'round'; c.beginPath(); c.moveTo(-r * .42, r * .04); c.lineTo(-r * .12, r * .34); c.lineTo(r * .45, -r * .28); c.stroke(); c.restore();
}
function text(s, x, y, size, col = '#111', w = 700, align = 'center', a = 1) { c.save(); c.globalAlpha *= a; c.font = `${w} ${size}px ${FONT}`; c.textAlign = align; c.textBaseline = 'middle'; c.fillStyle = col; c.fillText(s, x, y); c.restore(); }
function logo(x, y, size, t0, now) { // 글자가 하나씩 톡톡
  const s = T; c.save(); c.font = `700 ${size}px ${FONT}`; const total = c.measureText(s).width; let cx = x - total / 2;
  [...s].forEach((ch, i) => { const k = pop((now - t0 - i * .05) / .35), cw = c.measureText(ch).width;
    c.save(); c.translate(cx + cw / 2, y + (1 - k) * 40); c.globalAlpha = Math.min(1, k * 1.5); c.fillStyle = i < 3 ? PK : '#111'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(ch, 0, 0); c.restore(); cx += cw; });
  c.restore();
}
// 상자 + 공 두 개 (로딩 화면과 같은 모양)
const box = { B: [{ x: .3, y: .32, vx: .78, vy: .6, c: PK, sx: 1, sy: 1 }, { x: .7, y: .7, vx: -.68, vy: -.74, c: CY, sx: 1, sy: 1 }] };
function drawBox(cx, cy, S, draw, dt) {
  const r = S * .09, L = S - 8; c.save(); c.translate(cx - S / 2, cy - S / 2);
  c.lineWidth = Math.max(3, S * .025); c.strokeStyle = '#111'; c.setLineDash([4 * S * draw, 4 * S]); c.strokeRect(4, 4, L, L); c.setLineDash([]);
  if (draw > .5) {
    for (const b of box.B) {
      b.x += b.vx * dt; b.y += b.vy * dt; const m = (r + 6) / S;
      if (b.x < m) { b.x = m; b.vx = Math.abs(b.vx); b.sx = .72; b.sy = 1.25; } else if (b.x > 1 - m) { b.x = 1 - m; b.vx = -Math.abs(b.vx); b.sx = .72; b.sy = 1.25; }
      if (b.y < m) { b.y = m; b.vy = Math.abs(b.vy); b.sx = 1.25; b.sy = .72; } else if (b.y > 1 - m) { b.y = 1 - m; b.vy = -Math.abs(b.vy); b.sx = 1.25; b.sy = .72; }
      b.sx += (1 - b.sx) * .2; b.sy += (1 - b.sy) * .2;
    }
    const [a, d] = box.B, dx = (d.x - a.x) * S, dy = (d.y - a.y) * S, dist = Math.hypot(dx, dy);
    if (dist < r * 2 && dist > 0) { const nx = dx / dist, ny = dy / dist, va = a.vx * nx + a.vy * ny, vd = d.vx * nx + d.vy * ny; if (va - vd > 0) { a.vx += (vd - va) * nx; a.vy += (vd - va) * ny; d.vx += (va - vd) * nx; d.vy += (va - vd) * ny; } }
    c.globalAlpha = Math.min(1, (draw - .5) * 4);
    for (const b of box.B) { c.save(); c.translate(b.x * S, b.y * S); c.scale(b.sx, b.sy); c.fillStyle = b.c; c.beginPath(); c.arc(0, 0, r, 0, 7); c.fill(); c.fillStyle = '#fff'; c.beginPath(); c.arc(0, 0, r - S * .03, 0, 7); c.fill(); c.restore(); }
  }
  c.restore();
}
// 실제 게임 엔진으로 대결 장면
let game = null, gameWin = -1;
function makeGame() { // 영상 속 스킬(레이저·범위·자국·분신)을 쓰는 4명 대결
  const white = new Image(); white.src = avatarSrc({});
  const players = AI_SET.filter(a => a.anim).slice(0, 4).map((a, i) => ({ u: { uid: 'p' + i, nick: ['초록볼', '빨강볼', '슬라임', '그림자'][i], handle: 'p' + i }, img: white, color: PCOL[i], ai: true,
    skills: [{ s: { id: 'p' + i, name: a.name, color: a.color, comps: [], cd: 6, lv: 1, anim: a.anim(), sound: 'none' }, cd: 2.2, t: 1 }] }));
  const g = new Game(document.createElement('canvas'), { map: 'arena', seed: 2024, players, meIdx: 0, onEnd: () => { } });
  const hit = g.hit.bind(g); g.hit = (b, d, col, s) => hit(b, d * 4, col, s);
  g.onKill = wi => { gameWin = wi; };
  return g;
}
const maps = MAP_KEYS.map(k => { const m = document.createElement('canvas'); m.width = 300; m.height = 200; mapPreview(m, k); return { k, m }; });
// 배경 음악 (128 BPM)
function music(t0) {
  const a = AUD.o(); if (!a) return; const spb = 60 / 128, start = a.currentTime + .05;
  const bass = [45, 45, 41, 41, 48, 48, 43, 43], hz = n => 440 * Math.pow(2, (n - 69) / 12);
  const at = (fn, t) => { const d = start + t - a.currentTime; setTimeout(fn, Math.max(0, d * 1000 - 20)); };
  for (let i = 0; i < Math.floor(DUR / spb) - 1; i++) {
    const t = i * spb, bar = Math.floor(i / 4) % 8;
    at(() => { AUD.tone('sine', 150, 45, .22, .5); }, t);                                   // 킥
    if (i % 2) at(() => AUD.noise(.16, .22, 'bandpass', 1800, 1200, 0, .9), t);              // 스네어
    at(() => AUD.noise(.04, .07, 'highpass', 8000), t + spb / 2);                              // 하이햇
    at(() => AUD.tone('sawtooth', hz(bass[bar]), hz(bass[bar]), spb * .8, .06), t);            // 베이스
    if (i % 4 === 0) at(() => [0, 4, 7].forEach(st => AUD.tone('triangle', hz(bass[bar] + 24 + st), hz(bass[bar] + 24 + st), spb * 1.6, .025)), t + spb / 2);
  }
}
let T0 = 0, last = 0, started = false;
function frame(now) {
  const t = (now - T0) / 1000, dt = Math.min(.033, (now - last) / 1000); last = now;
  c.setTransform(1, 0, 0, 1, 0, 0); c.fillStyle = '#fff'; c.fillRect(0, 0, W, H);
  const fade = (a, b) => Math.min(ez((t - a) / .3), 1 - ez((t - b + .3) / .3));
  // 1) 인트로
  if (t < 2.9) { c.globalAlpha = fade(-1, 2.9); drawBox(W / 2, 520, 360, ez(t / .8), dt); logo(W / 2, 830, 104, .7, t); text('틱톡 프로필 공 배틀', W / 2, 930, 34, '#666', 500, 'center', ez((t - 1.6) / .4)); c.globalAlpha = 1; }
  // 2) 소개 문구
  else if (t < 5) { c.globalAlpha = fade(2.9, 5); const k = t - 2.9;
    text('내 틱톡 프로필이', W / 2, 520, 64, '#111', 700, 'center', ez(k / .35)); text('공이 되어', W / 2, 610, 64, '#111', 700, 'center', ez((k - .3) / .35)); text('박스 안에서 싸운다', W / 2, 700, 64, PK, 700, 'center', ez((k - .6) / .35)); c.globalAlpha = 1; }
  // 3) 실제 대결
  else if (t < 13) {
    if (!game) { game = makeGame(); game.started = true; }
    const k = t - 5; game.step(Math.min(.033, dt)); game.step(Math.min(.033, dt) * .4); game.draw();
    c.globalAlpha = fade(5, 13);
    const gw = 640, gh = gw * GH / GW; c.drawImage(game.cv, (W - gw) / 2, 230, gw, gh);
    const cap = k < 3.6 ? '공은 자동으로 싸워요' : (gameWin < 0 ? '스킬이 터지면 역전' : '승리!');
    text(cap, W / 2, 150, 52, gameWin < 0 ? '#111' : PK, 700, 'center', ez((k % 3.6) / .3));
    text('#4명대결  #레이저  #자동전투', W / 2, 1180, 30, '#888', 500, 'center', ez((k - .4) / .4)); c.globalAlpha = 1;
  }
  // 4) 맵
  else if (t < 16.3) { c.globalAlpha = fade(13, 16.3); const k = t - 13; text('맵 4가지', W / 2, 200, 64, '#111', 700, 'center', ez(k / .3));
    maps.forEach(({ k: mk, m }, i) => { const kk = pop((k - .25 - i * .18) / .4), x = i % 2 ? 380 : 40, y = 300 + Math.floor(i / 2) * 400;
      c.save(); c.globalAlpha *= Math.min(1, kk * 1.4); c.translate(x + 150, y + 100); c.scale(.6 + .4 * kk, .6 + .4 * kk); c.drawImage(m, -150, -100); c.restore();
      text(MAPS[mk].name, x + 150, y + 245, 40, '#111', 700, 'center', kk); text(MAPS[mk].desc.length > 16 ? MAPS[mk].desc.slice(0, 16) + '…' : MAPS[mk].desc, x + 150, y + 292, 22, '#777', 500, 'center', kk); });
    c.globalAlpha = 1; }
  // 5) 기능
  else if (t < 19.4) { c.globalAlpha = fade(16.3, 19.4); const k = t - 16.3;
    text('이런 것도 돼요', W / 2, 260, 60, '#111', 700, 'center', ez(k / .3));
    [['flask', '스킬을 직접 편집해서 만들기'], ['users', '최대 4명 대결 · AI 연습'], ['trophy', '랭킹 1·2·3등 단상'], ['film', '플레이 녹화 → 숏츠 편집']].forEach(([ic2, s], i) => {
      const kk = ez((k - .3 - i * .22) / .35), y = 420 + i * 170, x = 80 + (1 - kk) * -120;
      c.save(); c.globalAlpha *= kk; c.strokeStyle = '#e6e6eb'; c.lineWidth = 2; c.strokeRect(x, y - 60, 560, 120); c.drawImage(ICO[ic2], x + 30, y - 32, 64, 64); c.restore();
      text(s, x + 120, y, 36, '#111', 700, 'left', kk); });
    c.globalAlpha = 1; }
  // 6) 인증마크 이벤트
  else if (t < 22.4) { c.globalAlpha = fade(19.4, 22.4); const k = t - 19.4, bk = pop((k - .1) / .45);
    c.save(); c.translate(W / 2, 470); c.rotate((1 - bk) * -.6); c.scale(bk, bk); c.fillStyle = 'rgba(32,213,236,.18)'; c.beginPath(); c.arc(0, 0, 150 + 10 * Math.sin(t * 5), 0, 7); c.fill(); drawBadge(0, 0, 110); c.restore();
    text('지금 빨리 플레이하면', W / 2, 720, 54, '#111', 700, 'center', ez((k - .5) / .35));
    text('인증마크를 드려요!', W / 2, 805, 64, '#20B8D0', 700, 'center', ez((k - .8) / .35));
    text('먼저 온 플레이어만', W / 2, 900, 32, '#888', 500, 'center', ez((k - 1.2) / .35)); c.globalAlpha = 1; }
  // 7) 마무리
  else { const k = t - 22.4; drawBox(W / 2, 430, 260, Math.min(1, ez(k / .6) + .55), dt); logo(W / 2, 680, 96, 22.6, t);
    const pk = pop((k - .9) / .4), pulse = 1 + .04 * Math.sin(t * 7); c.save(); c.globalAlpha = Math.min(1, pk * 1.5); c.translate(W / 2, 830); c.scale(pk * pulse, pk * pulse);
    c.fillStyle = PK; c.fillRect(-190, -48, 380, 96); c.restore(); text('지금 플레이', W / 2, 830, 42, '#fff', 700, 'center', Math.min(1, pk * 1.5));
    text('created by @' + BB_CONFIG.CREDIT, W / 2, 1120, 28, '#999', 500, 'center', ez((k - 1.2) / .4)); }
  if (t < DUR) requestAnimationFrame(frame); else done();
}
let rec = null, chunks = [];
function begin() {
  document.getElementById('go').remove(); AUD.o();
  if (new URLSearchParams(location.search).get('rec')) {
    const st = cv.captureStream(30); if (AUD.dest) AUD.dest.stream.getAudioTracks().forEach(tr => st.addTrack(tr));
    rec = new MediaRecorder(st, { mimeType: 'video/webm;codecs=vp9,opus', videoBitsPerSecond: 8e6, audioBitsPerSecond: 160000 });
    rec.ondataavailable = e => e.data.size && chunks.push(e.data); rec.start(250);
  }
  T0 = last = performance.now(); music(0); started = true; requestAnimationFrame(frame);
}
function done() {
  if (!rec) return;
  rec.onstop = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' })); a.download = 'tikball_box_promo.webm'; document.body.appendChild(a); a.click(); window.__done = true; };
  setTimeout(() => rec.stop(), 300);
}
document.getElementById('go').onclick = begin;
</script>
</body>
</html>
