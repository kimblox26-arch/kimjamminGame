<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SKILL RPG</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="픽셀 스킬 RPG 테스트 버전: 옷장, 장비 뽑기, 스킬 상자, 공격 테스트">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hdr">
  <div class="hdr-in">
    <div class="logo">SKILL RPG<small>테스트 버전</small></div>
    <div class="hdr-btns">
      <button class="hbtn" id="btn-mute" type="button">🔊 소리</button>
      <button class="hbtn" id="btn-gems" type="button">보석 +10,000</button>
      <button class="hbtn" id="btn-unlock" type="button">전체 해금</button>
      <button class="hbtn" id="btn-reset" type="button">초기화</button>
    </div>
  </div>
</header>

<main class="wrap">
  <!-- 왼쪽: 캐릭터 미리보기 + 상세 정보 -->
  <section class="card left">
    <div class="pv">
      <div class="gem-pill"><i class="gem"></i><b id="gems">0</b></div>
      <canvas id="preview" width="24" height="34"></canvas>
    </div>
    <div class="detail" id="detail"></div>
  </section>

  <!-- 오른쪽: 탭 -->
  <section class="card right">
    <nav class="tabs" id="tabs">
      <button type="button" data-tab="closet">👕 내 옷장</button>
      <button type="button" data-tab="gear">🎁 장비 뽑기</button>
      <button type="button" data-tab="attack">⚔ 공격 테스트</button>
    </nav>

    <div class="pane" data-pane="closet">
      <div class="subtabs" id="subtabs">
        <button type="button" data-slot="head">머리</button>
        <button type="button" data-slot="body">몸</button>
        <button type="button" data-slot="legs">다리</button>
      </div>
      <div class="igrid" id="closet-grid"></div>
    </div>

    <div class="pane" data-pane="gear">
      <div class="boxlist" id="gear-boxes"></div>
    </div>

    <div class="pane" data-pane="attack">
      <div class="atk">
        <div class="arena" id="arena">
          <canvas id="game" width="256" height="144"></canvas>
          <div class="chip" id="atk-chip"></div>
          <div class="chip right" id="slime-name"></div>
          <div id="banner" class="banner"></div>
        </div>
        <div class="atk-side">
          <button class="abtn" id="btn-atk" type="button"><span class="cdfill"></span><span class="lbl">공격해 보기</span></button>
          <button class="abtn crit" id="btn-crit" type="button"><span class="cdfill"></span><span class="lbl">크리티컬</span></button>
          <label class="auto" for="auto"><input type="checkbox" id="auto"><span class="box"></span>자동 공격</label>
          <p class="keys">키보드 <b>Space</b> 공격 · <b>C</b> 크리티컬</p>
        </div>
      </div>
      <div class="boxlist sk" id="skill-boxes"></div>
      <div class="igrid sk" id="skill-grid"></div>
    </div>
  </section>
</main>

<div id="gacha-ov" class="ov" hidden>
  <div id="gacha-title" class="g-title"></div>
  <canvas id="gacha-cv" width="200" height="120"></canvas>
  <div id="gacha-hint" class="g-hint"></div>
  <div id="gacha-results" class="results"></div>
  <button id="gacha-ok" class="okbtn" type="button" hidden>확인</button>
</div>
<div id="toast" class="toast"></div>

<script src="js/audio.js"></script>
<script src="js/pixel.js"></script>
<script src="js/data.js"></script>
<script src="js/battle.js"></script>
<script src="js/skills.js"></script>
<script src="js/gacha.js"></script>
<script src="js/main.js"></script>
</body>
</html>
