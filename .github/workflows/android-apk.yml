# 주식 게임(stock/)을 안드로이드 앱(APK)으로 만들어 "apk-latest" 릴리스에 올려요.
# 다운로드: https://github.com/kimblox26-arch/kimjamminGame/releases/download/apk-latest/kids-stock.apk
name: Android APK

on:
  push:
    branches: ['ccr-c60d10f4-9005t9', 'main', 'master']
    paths: ['stock/**', 'android/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 게임을 한 파일로 묶기
        run: node stock/tools/build-artifact.mjs --full android/app/src/main/assets/index.html

      - name: APK 만들기
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: 파일 이름 정하기
        run: cp android/app/build/outputs/apk/release/app-release.apk kids-stock.apk

      - uses: actions/upload-artifact@v4
        with:
          name: kids-stock-apk
          path: kids-stock.apk

      - name: 릴리스에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest kids-stock.apk \
            --target "$GITHUB_SHA" \
            --title "어린이 주식 놀이터 (안드로이드 앱)" \
            --notes "kids-stock.apk 를 내려받아 설치하세요. 안드로이드 8.0 이상, 가로 화면 전용, 인터넷 연결 없이 동작해요." \
            --latest
